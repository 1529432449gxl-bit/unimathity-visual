<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picard iteration</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>.fx .katex-display{margin:0}</style></head>
<body><main>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Successive Picard approximations closing in on the solution, with the camera zooming in step by step"></canvas></div>
<div class="fx" id="fx"></div>
<div class="nav" id="nav"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s) => katex.render(s, el, { throwOnError: false, displayMode: true });
// 算例 y' = x - y², y(0)=0，区间 [0, 1.8]。各次近似与真解的最大误差约 1.07, .55, .40, .15, .05, .014, .003, .0007：
// 交替落在真解两侧、每轮缩小约四倍，后几轮用镜头跟随放大。
const f = (x, y) => x - y * y, X1 = 1.8, N = 3601, NK = 8;
const xs = Float64Array.from({ length: N }, (_, i) => X1 * i / (N - 1));
const phis = [new Float64Array(N)];
for (let k = 1; k < NK; k++) { const p = phis[k - 1], q = new Float64Array(N); let s = 0;
  for (let i = 1; i < N; i++) { s += (f(xs[i - 1], p[i - 1]) + f(xs[i], p[i])) / 2 * (xs[i] - xs[i - 1]); q[i] = s } phis.push(q) }
const tru = new Float64Array(N); for (let i = 1; i < N; i++) { const h = xs[i] - xs[i - 1], x = xs[i - 1], y = tru[i - 1];
  const k1 = f(x, y), k2 = f(x + h / 2, y + h / 2 * k1), k3 = f(x + h / 2, y + h / 2 * k2), k4 = f(x + h, y + h * k3); tru[i] = y + h / 6 * (k1 + 2 * k2 + 2 * k3 + k4) }
const FULL = [-.06, 1.9, -.12, 1.75];
function frameFor(k) {
  if (k <= 2) return FULL;
  // 镜头框住区间右端：三条线在这里分得最开；按末端斜率取宽度，使曲线斜穿画面
  const e = N - 1, ends = [phis[k - 1][e], phis[k][e], tru[e]], lo = Math.min(...ends), hi = Math.max(...ends), d = hi - lo;
  const slope = Math.max(.2, f(X1, tru[e])), H = d * 3.6, xsp = H * .78 / slope;
  return [X1 - xsp * .8, X1 + xsp * .2, lo - H * .62, hi + H * .38 - d];
}
const fx = document.getElementById('fx');
const formula = k => { fx.innerHTML = '<div></div><div></div>';
  K(fx.children[0], "y'=x-y^2,\\qquad y(0)=0");
  K(fx.children[1], k === 0 ? '\\varphi_0(x)=0' : `\\varphi_{${k}}(x)=\\int_0^x\\bigl(t-\\varphi_{${k - 1}}^2(t)\\bigr)\\,\\mathrm dt`) };
const v = P.view(FULL, { l: 16, r: 16, t: 16, b: 22 });
const lab = P.labels(document.getElementById('stage'));
let st, intro = 0, mapA = { a: 0 };
const pts = (arr, p = 1) => { const out = [], [x0, x1] = v.b, pad = (x1 - x0) * .05;
  const i0 = Math.max(0, Math.floor((x0 - pad) / X1 * (N - 1))), i1 = Math.min(N - 1, Math.ceil((x1 + pad) / X1 * (N - 1)));
  const step = Math.max(1, Math.floor((i1 - i0) / 900));
  for (let i = i0; i <= i1; i += step) out.push([v.X(xs[i]), v.Y(arr[i])]); if ((i1 - i0) % step) out.push([v.X(xs[i1]), v.Y(arr[i1])]); return out };
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  v.w = w; v.h = h; intro = Math.min(1, intro + dt / 1.2);
  const moving = st.tick(dt), cam = v.step(dt, 2.6), k = st.i, p = st.p;
  P.axes(ctx, v, { x: true });
  // 真解：灰色细线常驻
  P.path(ctx, pts(tru), { color: C.mute, width: 1.4, alpha: .9, progress: P.ease.inOut(intro) });
  // 更早的近似：按年龄淡出
  for (let j = Math.max(0, k - 4); j < k - 1; j++) P.path(ctx, pts(phis[j]), { color: C.blue, width: 1.2, alpha: .35 * Math.pow(.55, k - 2 - j) });
  // 上一次近似：深蓝；本次近似：橙色，从 x0 向右逐段积分出来
  if (k >= 1) P.path(ctx, pts(phis[k - 1]), { color: C.accent, width: 2, alpha: .85 });
  const pk = k === 0 ? P.ease.inOut(P.seg(p, 0, .8)) : P.ease.inOut(P.seg(p, .15, .95));
  // 本次近似：逐段画出时，笔尖之前用视窗内的比例
  const cur = pts(phis[k]); P.path(ctx, cur, { color: C.warm, width: 2.6, progress: pk, halo: 3 });
  if (pk > 0 && pk < 1 && cur.length > 1) { let L = 0; const acc = [0]; for (let i = 1; i < cur.length; i++) { L += Math.hypot(cur[i][0] - cur[i - 1][0], cur[i][1] - cur[i - 1][1]); acc.push(L) }
    const s = L * pk; let i = acc.findIndex(a => a >= s); if (i < 1) i = 1; const t = (s - acc[i - 1]) / (acc[i] - acc[i - 1] || 1);
    P.dot(ctx, P.lerp(cur[i - 1][0], cur[i][0], t), P.lerp(cur[i - 1][1], cur[i][1], t), { r: 4.2, color: C.warm }) }
  // 标签放在视窗右侧边缘
  const at = arr => { const xr = Math.min(v.b[1] - (v.b[1] - v.b[0]) * .06, X1), i = Math.round(xr / X1 * (N - 1)); return [v.X(xs[i]), v.Y(arr[i])] };
  const [lx, ly] = at(phis[k]), [px, py] = k ? at(phis[k - 1]) : [0, 0], [tx, ty] = at(tru);
  const sep = (a, b) => Math.abs(a - b) < 16 ? (a < b ? -8 : 8) : 0;
  lab.set('k', `\\varphi_{${k}}`, lx + 18, ly + sep(ly, ty) - 2, { color: C.warm, alpha: pk });
  lab.set('k1', `\\varphi_{${Math.max(0, k - 1)}}`, px + 18, py + sep(py, ty) - 2, { color: C.accent, alpha: k ? .9 : 0 });
  { const xq = Math.min(X1, v.b[0] + (v.b[1] - v.b[0]) * .42), i = Math.round(xq / X1 * (N - 1)), s = (tru[Math.min(N - 1, i + 5)] - tru[Math.max(0, i - 5)]) / (xs[Math.min(N - 1, i + 5)] - xs[Math.max(0, i - 5)]), up = (phis[k][i] > tru[i]) ? 1 : -1;
    lab.set('y', 'y', v.X(xs[i]), v.Y(tru[i]) + (up > 0 ? 14 : -14), { color: C.mute, alpha: intro }) }
  // 角落小地图：放大后渐显
  const zoomed = (v.b[1] - v.b[0]) < 1.2; P.approach(mapA, 'a', zoomed ? 1 : 0, dt, 5);
  P.minimap(ctx, v, { B: FULL, alpha: mapA.a, corner: 'tl', paint: (mx, my, c) => {
    const mp = arr => { const o = []; for (let i = 0; i < N; i += 60) o.push([mx(xs[i]), my(arr[i])]); o.push([mx(xs[N - 1]), my(arr[N - 1])]); return o };
    P.path(c, mp(tru), { color: C.mute, width: 1 }); if (k) P.path(c, mp(phis[k - 1]), { color: C.accent, width: 1, alpha: .8 }); P.path(c, mp(phis[k]), { color: C.warm, width: 1.4 }) } });
  lab.end();
  return moving || cam || intro < 1 || mapA.a > .01 && mapA.a < .99;
});
st = P.stepper(document.getElementById('nav'), { count: NK, dur: 2.2, hold: .9, kick: cv.kick, onChange: s => { v.aim(frameFor(s.i)); formula(s.i) } });
const lockFx = () => { const cur = st.i; let m = 0; fx.style.minHeight = ''; for (let i = 0; i < NK; i++) { formula(i); m = Math.max(m, fx.getBoundingClientRect().height) } fx.style.minHeight = Math.ceil(m) + 1 + 'px'; formula(cur) };
lockFx(); document.fonts && document.fonts.ready.then(lockFx);
st.go(0, true);
// 首次进入视口自动播放；手动操作即暂停（stepper 自带）；离开视口暂停
let touched = false; document.getElementById('nav').addEventListener('pointerdown', () => touched = true, true); addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') touched = true });
const playBtn = document.querySelector('#nav .play');
new IntersectionObserver(es => { if (es[0].isIntersecting) { if (!touched && !st.playing) setTimeout(() => { if (!touched && !st.playing) playBtn.click() }, 1300) } else if (st.playing) st.stop() }, { threshold: .4 }).observe(document.getElementById('cv'));
P.reportHeight(document.querySelector('main'));
window.picardErr = () => phis.map(p => Math.max(...p.map((y, i) => Math.abs(y - tru[i]))));
</script></body></html>
