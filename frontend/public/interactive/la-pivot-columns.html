<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pivot columns</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script><script src="vendor/lasteps.js"></script>
</head><body><main></main>
<script>
const {gen,sub,isV,isC}=LAS;
const R=['1','2','3','\\vdots','s'], C=['1','2','3','4','\\cdots','n'];
const A=gen(R,C,(r,c,i,j,m)=>m?null:`a_${sub(r,c)}`);
const piv={0:0,1:1,2:3};
const B=gen(R,C,(r,c,i,j,m)=>{
  if(i>=3) return m==='c'?'\\cdots':(m==='v'?null:'0');
  if(m==='c') return null;
  if(j<(piv[i]??99)) return '0';
  return `b_${sub(r,c)}`;
});
B[3]=B[3].map((x,j)=>j<4?'\\vdots':x);
const mA=(tint)=>({key:'A',label:'A=(\\alpha_1,\\,\\alpha_2,\\,\\alpha_3,\\,\\alpha_4,\\,\\cdots,\\,\\alpha_n)',cells:A,tint});
const mB=(tint)=>({key:'B',label:'B=(\\beta_1,\\,\\beta_2,\\,\\beta_3,\\,\\beta_4,\\,\\cdots,\\,\\beta_n)',cells:B,tint});
const arrow={key:'ar',sym:'\\xrightarrow{\\ \\text{row}\\ }'};
const colT=(cols,cls)=>R.map((_,i)=>C.map((_,j)=>cols.includes(j)?cls:''));
const colH=(key,cols,cls,rows=[0,1,2,4])=>cols.flatMap(j=>rows.map(i=>[key,i,j,cls]));
const steps=[
 {mats:[mA(),arrow,mB()],hi:[],lines:['A\\ \\xrightarrow{\\ \\text{elementary row operations}\\ }\\ B']},
 {mats:[mA(),arrow,mB()],hi:[['B',0,0,'s'],['B',1,1,'s'],['B',2,3,'s']],lines:['\\text{pivot columns of }B:\\ 1,\\,2,\\,4,\\,\\cdots']},
 {mats:[mA(),arrow,mB(colT([0,1,3],'k1'))],hi:[...colH('B',[2],'t',[0,1]),...colH('B',[0,1],'s',[0,1])],lines:['\\beta_3=k_1\\beta_1+k_2\\beta_2']},
 {mats:[mA(),arrow,mB(colT([0,1,3],'k1'))],hi:[...colH('A',[2],'t'),...colH('A',[0,1],'s')],lines:['Bx=0\\iff Ax=0','\\alpha_3=k_1\\alpha_1+k_2\\alpha_2']},
 {mats:[mA(colT([0,1,3],'k1')),arrow,mB(colT([0,1,3],'k1'))],hi:[...colH('A',[0,1,3],'s')],lines:['\\alpha_{j_1},\\,\\alpha_{j_2},\\,\\cdots,\\,\\alpha_{j_r}\\ \\text{maximal independent},\\quad r(A)=r']},
];
LAS.run({steps,interval:1900});
</script></body></html>
