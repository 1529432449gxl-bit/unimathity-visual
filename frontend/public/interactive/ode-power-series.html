<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power series solution</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{height:340px}@media(max-width:520px){canvas#cv{height:280px}}.fx .katex-display{margin:0}.fx>div{transition:opacity .35s}</style></head>
<body><main>
<div class="top"><button type="button" class="tg" data-s="0" aria-pressed="true"></button><button type="button" class="tg" data-s="1" aria-pressed="false"></button></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Partial sums of the power series solution approach the true solution term by term"></canvas></div>
<div class="fx" id="fx"></div>
<div class="nav" id="nav"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s, d = true) => katex.render(s, el, { throwOnError: false, displayMode: d });
// 艾里方程 x''=tx：常点 t=0，a_{n+3}=a_n/((n+2)(n+3))。负半轴振荡，部分和逐项向左“占领”更长的区间。
const TR = [-6.9, 1.95], YR = [-2.3, 3.3], NK = 16;            // 第 k 步加到 t^{3k}（或 t^{3k+1}）项，共 16 项
let sol = 0, coef = [], ref = null;
function setup() {
  const a = Array(3 * NK + 4).fill(0); a[0] = sol ? 0 : 1; a[1] = sol ? 1 : 0;
  for (let n = 0; n + 3 < a.length; n++) a[n + 3] = a[n] / ((n + 2) * (n + 3));
  coef = a;
  // 参照解：RK4 细步长从 0 向两侧积分
  const h = .002, L = [], R = [];
  for (const dir of [-1, 1]) { let t = 0, x = a[0], y = a[1]; const out = dir < 0 ? L : R, T = dir < 0 ? TR[0] : TR[1];
    while (dir * t <= dir * T + h) { out.push([t, x]); const F = (t, x, y) => [y, t * x], s = dir * h;
      const k1 = F(t, x, y), k2 = F(t + s / 2, x + s / 2 * k1[0], y + s / 2 * k1[1]), k3 = F(t + s / 2, x + s / 2 * k2[0], y + s / 2 * k2[1]), k4 = F(t + s, x + s * k3[0], y + s * k3[1]);
      x += s / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]); y += s / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]); t += s } }
  ref = [...L.reverse(), ...R.slice(1)];
}
const exact = t => { const i = P.clamp(Math.round((t - ref[0][0]) / .002), 0, ref.length - 1); return ref[i][1] };
const S = (k, t) => { let s = 0, tp = 1; const deg = 3 * k + sol; for (let n = 0; n <= deg; n++) { s += coef[n] * tp; tp *= t } return s };
// 吻合前沿：从 0 向左，部分和与真解相差小于阈值的最左点
const front = k => { let t = 0; for (; t > TR[0]; t -= .02) if (Math.abs(S(k, t) - exact(t)) > .05) break; return t };
const fx = document.getElementById('fx');
function formula() {
  fx.innerHTML = '<div></div><div></div>';
  K(fx.children[0], 'x^{\\prime\\prime}=t\\,x,\\qquad a_{n+3}=\\dfrac{a_n}{(n+2)(n+3)}');
  K(fx.children[1], sol ? 'x_2=t+\\dfrac{t^4}{3\\cdot4}+\\dfrac{t^7}{3\\cdot4\\cdot6\\cdot7}+\\cdots' : 'x_1=1+\\dfrac{t^3}{2\\cdot3}+\\dfrac{t^6}{2\\cdot3\\cdot5\\cdot6}+\\cdots');
}
const lab = P.labels(document.getElementById('stage'));
const v = P.view([TR[0], TR[1], YR[0], YR[1]], { l: 14, r: 14, t: 14, b: 16 });
let st, sh = { fr: 0, intro: 0 };
// 采样并在出界处断开，避免竖直长线
function sampled(fn) { const n = Math.max(240, Math.round(v.w * 1.6)), segs = []; let cur = [];
  for (let i = 0; i <= n; i++) { const t = TR[0] + (TR[1] - TR[0]) * i / n, y = fn(t);
    if (Number.isFinite(y) && y > YR[0] - 1.5 && y < YR[1] + 1.5) cur.push([v.X(t), v.Y(y)]); else { if (cur.length > 1) segs.push(cur); cur = [] } }
  if (cur.length > 1) segs.push(cur); return segs }
const cvEl = document.getElementById('cv');
const cv = P.mount(cvEl, (ctx, w, h, dt) => {
  v.w = w; v.h = h;
  const k = st.i, sp = 1 / P.lerp(.75, 2.6, (k / (NK - 1)) ** 1.3);   // 先快后慢：每步时长逐渐变长
  const moving = st.tick(dt * sp), p = P.ease.inOut(st.p);
  let anim = sh.intro < 1; sh.intro = Math.min(1, sh.intro + dt / 1.4); const I = P.ease.inOut(sh.intro);
  anim = P.spring(sh, 'fr', front(k), dt, { k: 60, z: .75 }) | anim;
  P.axes(ctx, v, { x: true, y: true });
  // 吻合区间：x 轴上的浅蓝带
  ctx.fillStyle = P.vgrad(ctx, v.Y(0) - 5, v.Y(0) + 5, C.blue, .35, .15); ctx.fillRect(v.X(sh.fr), v.Y(0) - 3, v.X(TR[1]) - v.X(sh.fr), 6);
  // 参照解：灰色
  for (const s of sampled(exact)) P.path(ctx, s, { color: C.mute, width: 1.8, alpha: .85, progress: I });
  // 历史部分和：浅蓝，按年龄淡出
  for (let j = Math.max(0, k - 3); j < k; j++) for (const s of sampled(t => S(j, t))) P.path(ctx, s, { color: C.blue, width: 1.2, alpha: .4 * (1 - (k - 1 - j) / 3) });
  // 当前部分和：从上一项连续变形到当前项
  const cur = t => k === 0 ? S(0, t) : P.lerp(S(k - 1, t), S(k, t), p);
  for (const s of sampled(cur)) P.path(ctx, s, { color: C.accent, width: 2.4, halo: 2, alpha: I });
  // 前沿点：橙色
  P.dot(ctx, v.X(sh.fr), v.Y(exact(sh.fr)), { r: 5, color: C.warm, scale: I });
  P.path(ctx, [[v.X(sh.fr), v.Y(0)], [v.X(sh.fr), v.Y(exact(sh.fr))]], { color: C.warm, width: 1.2, dash: [3, 4], alpha: .8 * I });
  lab.set('t', 't', v.X(TR[1]) - 8, v.Y(0) + 13, { color: C.mute, size: 13 });
  lab.end();
  return moving || anim;
});
st = P.stepper(document.getElementById('nav'), { count: NK, dur: 1.4, hold: .55, kick: () => cv.kick(), onChange: () => {} });
document.querySelectorAll('.tg').forEach(b => K(b, `x_${+b.dataset.s + 1}`, false));
let touched = false;
const setSol = s => { sol = s; setup(); formula(); document.querySelectorAll('.tg').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.s === s))); st.go(0, false); cv.kick() };
document.querySelectorAll('.tg').forEach(b => b.onclick = () => { touched = true; setSol(+b.dataset.s) });
document.getElementById('nav').addEventListener('pointerdown', () => { touched = true });
setSol(0);
{ let m = 0; for (const s of [0, 1]) { sol = s; formula(); m = Math.max(m, fx.getBoundingClientRect().height) } fx.style.minHeight = Math.ceil(m) + 'px'; sol = 0; formula() }
new IntersectionObserver(es => { if (es[0].isIntersecting) { if (!touched && !st.playing) setTimeout(() => { if (!touched && !st.playing) document.querySelector('.play').click() }, 900) } else st.stop() }, { threshold: .4 }).observe(cvEl);
P.reportHeight(document.querySelector('main'));
</script></body></html>
