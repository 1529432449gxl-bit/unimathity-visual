<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coordinates under change of basis</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>main{max-width:900px;margin:auto}.stage canvas{height:360px}@media(max-width:520px){.stage canvas{height:300px}}</style></head>
<body><main>

<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Coordinates under change of basis"></canvas></div>
<div class="controls"><button type="button" class="tg" id="play" aria-pressed="false">Play</button></div>
<div class="legend" id="lg"></div>
<div class="fx"><div id="eq"></div></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
import * as G from './vendor/la2d.js';
P.style();
const { C } = P, stage = document.getElementById('stage'), canvas = document.getElementById('cv'), lab = P.labels(stage), lg = document.getElementById('lg');
const v = G.plane(.85); v.cx = .55; v.cy = .5;
const S = { al: [1.05, 0.85], alT: [1.05, 0.85], e1: [1, .2], e1T: [1, .2], e2: [.35, 0.9], e2T: [.35, 0.9], playing: false, ph: 0 };
const set = G.playToggle(document.getElementById('play'), S, () => cv.kick());
G.legend(lg, [['\\alpha', C.accent], ['\\varepsilon_1,\\ \\varepsilon_2', C.mute], ['\\eta_1,\\ \\eta_2', C.blue], ['y_1\\eta_1,\\ y_2\\eta_2', C.warm]]);
const eq = G.formulas(document.getElementById('eq'), ['(\\eta_1,\\,\\cdots,\\,\\eta_n)=(\\varepsilon_1,\\,\\cdots,\\,\\varepsilon_n)P,\\qquad X=PY']);
eq('(\\eta_1,\\,\\cdots,\\,\\eta_n)=(\\varepsilon_1,\\,\\cdots,\\,\\varepsilon_n)P,\\qquad X=PY');
const ok = (a, b) => G.len(a) > .45 && G.len(b) > .45 && G.len(a) < 1.35 && G.len(b) < 1.35 && Math.abs(G.cross(a, b)) > .35 * G.len(a) * G.len(b);
const hd = G.handles(canvas, v, () => [{ id: 0, p: S.al }, { id: 1, p: S.e1 }, { id: 2, p: S.e2 }], (id, w) => {
  if (id === 0) { if (G.len(w) < 1.6) S.alT = w } else if (id === 1) { if (ok(w, S.e2T)) S.e1T = w } else { if (ok(S.e1T, w)) S.e2T = w } }, { onStart: () => set(false), kick: () => cv.kick() });
const cv = P.mount(canvas, (ctx, w, h, dt) => {
  v.fit(w, h);
  if (S.playing) { S.ph += dt * 0.6; const t = S.ph; S.e1T = G.apply(G.rot(0.35 * Math.sin(t)), [1, .2]); S.e2T = G.apply(G.rot(-0.4 * Math.sin(0.8 * t + .6)), [.35, .9]) }
  let mv = false; for (const k of ['al', 'e1', 'e2']) mv = P.approach(S, k, S[k + 'T'], dt, 10) || mv;
  const { al, e1, e2 } = S, Bm = [[e1[0], e2[0]], [e1[1], e2[1]]];
  const [y1, y2] = G.coords(e1, e2, al), u = G.mul(y1, e1);
  G.seg(ctx, v, [al[0], 0], al, { color: C.mute, width: 1, dash: [3, 4], alpha: .7 }); G.seg(ctx, v, [0, 0], [al[0], 0], { color: C.mute, width: 1.4, alpha: .6 });
  G.arrow(ctx, v, [0, 0], u, { color: C.warm, width: 2 }); G.arrow(ctx, v, u, al, { color: C.warm, width: 2 });
  G.arrow(ctx, v, [0, 0], [1, 0], { color: C.mute, width: 1.8, head: 8 }); G.arrow(ctx, v, [0, 0], [0, 1], { color: C.mute, width: 1.8, head: 8 });
  G.arrow(ctx, v, [0, 0], e1, { color: C.blue, width: 2.4 }); G.arrow(ctx, v, [0, 0], e2, { color: C.blue, width: 2.4 });
  G.arrow(ctx, v, [0, 0], al, { color: C.accent, width: 3 });
  for (const [id, p, c] of [[0, al, C.accent], [1, e1, C.blue], [2, e2, C.blue]]) G.dotAt(ctx, v, p, { r: hd.active === id || hd.hover === id ? 6.5 : 4.8, color: c });
  const L = (id, t, p, c, dx, dy) => { const s = v.S(p); lab.set(id, t, s[0], s[1], { dx, dy, color: c }) };
  L('a', '\\alpha', al, C.accent, 12, -12); L('e1', '\\eta_1', e1, C.blue, 14, 10); L('e2', '\\eta_2', e2, C.blue, -14, -6);
  L('s1', '\\varepsilon_1', [1, 0], C.mute, 6, 14); L('s2', '\\varepsilon_2', [0, 1], C.mute, -16, 0); lab.end();
  return mv || S.playing || hd.active != null;
});
cv.kick();

P.reportHeight(document.querySelector('main'));
</script></body></html>
