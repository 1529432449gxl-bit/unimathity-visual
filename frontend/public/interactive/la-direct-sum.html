<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Direct sum</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>main{max-width:900px;margin:auto}.stage canvas{height:380px}@media(max-width:520px){.stage canvas{height:310px}}</style></head>
<body><main>
<div class="top" id="mode"></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Direct sum"></canvas></div>
<div class="controls"><button type="button" class="tg" id="play" aria-pressed="false">Play</button></div>
<div class="legend" id="lg"></div>
<div class="fx"><div id="eq"></div></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
import * as V from './vendor/view3d.js';
import * as T from './vendor/la3d.js';
P.style();
const { C } = P, stage = document.getElementById('stage'), canvas = document.getElementById('cv'), lab = P.labels(stage), lg = document.getElementById('lg');
const L3 = (cam, id, tex, p, color, dx = 12, dy = -10, alpha = 1) => { const q = cam.P(p); lab.set(id, tex, q[0], q[1], { dx, dy, color, alpha }) };
const a = T.unit([1, -0.15, 0.1]), g = T.unit([0.15, 1, 0.1]), wl = T.unit([0.25, 0.35, 1]), b = T.unit([-0.2, 0.15, 1]);
const S = { mode: 'dir', ph: 0, playing: false, t: 0 };
const cam = V.camera({ az: -0.7, el: 0.36 });
const set = T.playToggle(document.getElementById('play'), S, () => cv.kick());
const dr = V.drag(canvas, cam, () => cv.kick(), { onStart: () => set(false) });
T.segmented(document.getElementById('mode'), [['dir', 'U\\oplus W'], ['sum', 'U+W']], 'dir', m => { S.mode = m; S.ph = 0; setLegend(); cv.kick() });
const F = { dir: 'x=u+w\\ \\text{unique}\\iff U\\cap W=\\{0\\}', sum: 'x=(u+t\\gamma)+(w-t\\gamma),\\qquad \\gamma\\in U\\cap W' };
const eq = T.formulas(document.getElementById('eq'), [F.dir, F.sum]);
const setLegend = () => T.legend(lg, S.mode === 'dir' ? [['U', C.accent], ['W', C.blue], ['x', C.ink], ['u', C.accent], ['w', C.blue]] : [['U', C.accent], ['W', C.blue], ['U\\cap W', C.warm], ['x', C.ink], ['u', C.accent], ['w', C.blue]]);
setLegend();
const cv = P.mount(canvas, (ctx, wd, ht, dt) => {
  cam.sc = Math.min(wd / 4.2, ht / 3.3); cam.ox = wd / 2; cam.oy = ht * 0.58;
  if (S.playing) S.ph += dt * 0.7;
  V.axes(ctx, cam, [1.6, 1.6, 1.5], { alpha: .3 });
  let u, w, x;
  if (S.mode === 'dir') {
    x = T.lin([0.7 + 0.35 * Math.cos(S.ph), a], [0.35 * Math.sin(S.ph), g], [0.95 + 0.2 * Math.sin(0.7 * S.ph), wl]);
    const k = T.dot(x, T.cross(a, g)) / T.dot(wl, T.cross(a, g)); w = T.mul(k, wl); u = T.sub(x, w);
    V.paint(ctx, cam, [T.plane([0, 0, 0], a, g, C.accent, .13, 1.3)]); T.edge(ctx, cam, [0, 0, 0], a, g, { color: C.accent, s: 1.3, alpha: .3 });
    V.line(ctx, cam, [T.mul(-1.4, wl), T.mul(1.6, wl)], { color: C.blue, width: 2, alpha: .8 });
    L3(cam, 'W', 'W', T.mul(1.6, wl), C.blue, 12, 0);
  } else {
    x = T.lin([0.75, a], [0.2, g], [0.9, b]);
    const tt = 0.7 * Math.sin(S.ph); u = T.lin([0.75, a], [0.2 + tt, g]); w = T.sub(x, u);
    V.paint(ctx, cam, [T.plane([0, 0, 0], a, g, C.accent, .12, 1.3), T.plane([0, 0, 0], g, b, C.blue, .14, 1.3)]);
    T.edge(ctx, cam, [0, 0, 0], a, g, { color: C.accent, s: 1.3, alpha: .3 }); T.edge(ctx, cam, [0, 0, 0], g, b, { color: C.blue, s: 1.3 });
    V.line(ctx, cam, [T.mul(-1.7, g), T.mul(1.7, g)], { color: C.warm, width: 2, alpha: .85 });
    L3(cam, 'W', 'W', T.lin([1.2, b], [-1.1, g]), C.blue, 0, 0); L3(cam, 'g', '\\gamma', T.mul(1.75, g), C.warm, 14, -6);
  }
  V.line(ctx, cam, [u, x], { color: C.blue, width: 1, dash: [3, 4], alpha: .6 }); V.line(ctx, cam, [w, x], { color: C.accent, width: 1, dash: [3, 4], alpha: .6 });
  V.arrow(ctx, cam, [0, 0, 0], u, { color: C.accent, width: 2.4 }); V.arrow(ctx, cam, [0, 0, 0], w, { color: C.blue, width: 2.4 });
  V.arrow(ctx, cam, [0, 0, 0], x, { color: C.ink, width: 2.6 });
  L3(cam, 'U', 'U', T.lin([1.25, a], [-1.15, g]), C.accent, 0, 0); L3(cam, 'x', 'x', x, C.ink, 12, -10); L3(cam, 'u', 'u', u, C.accent, 10, 12); L3(cam, 'w', 'w', w, C.blue, -14, -6);
  lab.end(); eq(F[S.mode]);
  return S.playing || dr.active;
});
cv.kick();

P.reportHeight(document.querySelector('main'));
</script></body></html>
