<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Type I and type II errors</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{touch-action:none}</style></head>
<body><main>
<div class="controls"><span class="n" id="lc"></span><input id="c" type="range" min="-0.4" max="1.6" step="0.005" value="0.62" aria-label="critical value"></div>
<div class="controls"><span class="n" id="ln"></span><input id="n" type="range" min="4" max="30" step="0.1" value="8" aria-label="sample size"></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Moving the critical value trades one error probability against the other"></canvas></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s) => katex.render(s, el, { throwOnError: false });
const glow = (ctx, x, y, r, col, a = .16) => { if (a <= 0) return; ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = P.rgba(col, a); ctx.fill(); ctx.restore() };
K(document.getElementById('lc'), 'c'); K(document.getElementById('ln'), 'n');
const mu0 = 0, mu1 = 1.1, sd = 1.6;
const pdf = (x, m, s) => Math.exp(-((x - m) ** 2) / (2 * s * s)) / (Math.sqrt(2 * Math.PI) * s);
const sc = document.getElementById('c'), sn = document.getElementById('n'), st = { c: 1.5, n: 4 };
const v = P.view([-1.7, 2.8, -.05, 1.9], { l: 14, r: 14, t: 26, b: 28 });
const lab = P.labels(document.getElementById('stage'));
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  v.w = w; v.h = h;
  const mv = P.approach(st, 'c', +sc.value, dt, 10) | P.approach(st, 'n', +sn.value, dt, 7);
  const s = sd / Math.sqrt(st.n), c = st.c, top = pdf(0, 0, s) * 1.22; v.aim([-1.7, 2.8, -top * .03, top]); const mc = v.step(dt, 3.5);
  const f0 = x => pdf(x, mu0, s), f1 = x => pdf(x, mu1, s), base = x => [v.X(x), v.Y(0)];
  P.axes(ctx, v, { x: true });
  // α：H0 下落入拒绝域（c 右侧）；β：H1 下落入接受域（c 左侧）
  const ra = P.curve(v, f0, c, v.b[1], 200), rb = P.curve(v, f1, v.b[0], c, 200);
  P.fill(ctx, ra, [base(c), base(v.b[1])], P.rgba(C.warm, .45));
  P.fill(ctx, rb, [base(v.b[0]), base(c)], P.rgba(C.blue, .28));
  P.path(ctx, P.curve(v, f0), { color: C.accent, width: 2.6, halo: 3 });
  P.path(ctx, P.curve(v, f1), { color: C.blue, width: 2.4, halo: 3 });
  P.path(ctx, [base(c), [v.X(c), v.Y(v.b[3] * .96)]], { color: C.mute, width: 1.2, dash: [4, 4] });
  P.path(ctx, [[v.X(c), v.Y(0) + 6], [v.X(v.b[1]), v.Y(0) + 6]], { color: C.warm, width: 3 });
  glow(ctx, v.X(c), v.Y(0), 14, C.warm, drag ? .26 : .14); P.dot(ctx, v.X(c), v.Y(0), { r: 5.5, color: C.warm });
  lab.set('h0', 'H_0', v.X(mu0), v.Y(f0(mu0)) - 13, { color: C.accent });
  lab.set('h1', 'H_1', v.X(mu1), v.Y(f1(mu1)) - 13, { color: C.blue });
  lab.set('c', 'c', v.X(c), v.Y(v.b[3] * .96) - 9, { color: C.soft, size: 13 });
  lab.set('w', 'W', (v.X(c) + v.X(v.b[1])) / 2, v.Y(0) + 18, { color: C.warm, size: 13 });
  const xa = c + Math.max(.12, s * .45), xb = c - Math.max(.12, s * .45);
  lab.set('a', '\\alpha', v.X(xa), v.Y(f0(xa) * .45) - 2, { color: C.warm, alpha: f0(xa) > .06 ? 1 : 0, dx: 10 });
  lab.set('b', '\\beta', v.X(xb), v.Y(f1(xb) * .45) - 2, { color: C.blue, alpha: f1(xb) > .06 ? 1 : 0, dx: -10 });
  lab.end();
  return mv || mc;
});
for (const el of [sc, sn]) el.addEventListener('input', cv.kick);
const cvs = document.getElementById('cv'); let drag = false;
const setC = e => { const r = cvs.getBoundingClientRect(); const t = (e.clientX - r.left - v.pad.l) / (r.width - v.pad.l - v.pad.r); sc.value = P.clamp(v.b[0] + t * (v.b[1] - v.b[0]), +sc.min, +sc.max); cv.kick() };
cvs.addEventListener('pointerdown', e => { drag = true; cvs.setPointerCapture(e.pointerId); setC(e) });
cvs.addEventListener('pointermove', e => { if (drag) setC(e) });
cvs.addEventListener('pointerup', () => drag = false);
P.reportHeight(document.querySelector('main'));
</script></body></html>
