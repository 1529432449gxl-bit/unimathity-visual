<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arc length</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>main{max-width:900px;margin:auto}.stage canvas{height:340px}.fx{min-height:64px;justify-content:center}@media(max-width:520px){.stage canvas{height:280px}.fx{min-height:78px}}</style></head>
<body><main>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="arc length: partition, approximate by chords, sum, take the limit"></canvas></div>
<div class="legend" id="legend"></div>
<div class="fx" id="fx"><div id="eq"></div></div>
<div class="nav" id="nav"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s) => katex.render(s, el, { throwOnError: false, displayMode: true }), KI = (el, s) => katex.render(s, el, { throwOnError: false });
const a = 0, b = 6;
const f = x => 0.9 * Math.sin(1.1 * x) + 0.18 * x + 0.35 * Math.sin(2.7 * x + 0.6);
const df = x => 0.99 * Math.cos(1.1 * x) + 0.18 + 0.945 * Math.cos(2.7 * x + 0.6);
// 每一步：n 为分点数，mode 为阶段（split 分割 / zoom 近似 / sum 求和 / lim 取极限）
const STEPS = [
  { n: 6, mode: 'split', tex: 'a=x_0<x_1<\\cdots<x_n=b,\\qquad \\Delta x_i=x_i-x_{i-1}' },
  { n: 6, mode: 'zoom', tex: '|M_{i-1}M_i|=\\sqrt{(\\Delta x_i)^2+(\\Delta y_i)^2}=\\sqrt{1+f\'(\\xi_i)^2}\\,\\Delta x_i' },
  { n: 6, mode: 'sum', tex: 's\\approx\\sum_{i=1}^{n}\\sqrt{1+f\'(\\xi_i)^2}\\,\\Delta x_i' },
  { n: 12, mode: 'lim', tex: 's=\\lim_{\\lambda\\to0}\\sum_{i=1}^{n}\\sqrt{1+f\'(\\xi_i)^2}\\,\\Delta x_i=\\int_a^b\\sqrt{1+f\'(x)^2}\\,\\mathrm dx' },
  { n: 24, mode: 'lim' }, { n: 48, mode: 'lim' }];
STEPS.forEach((s, i) => { if (!s.tex) s.tex = STEPS[i - 1].tex });
const PIECE = 0; // 放大观察的一段
const FULL = [-0.3, 6.3, -1.25, 2.55];
const stage = document.getElementById('stage'), lab = P.labels(stage), eqEl = document.getElementById('eq');
for (const [t, c, d] of [['y=f(x)', C.accent], ['\\text{chord}', C.warm], ['\\text{tangent at }\\xi_i', C.blue, 1]]) {
  const e = document.createElement('span'); e.className = 'key' + (d ? ' dash' : ''); e.style.setProperty('--c', c); KI(e, t); document.getElementById('legend').append(e);
}
// 公式区预排，锁定最大高度
for (const s of STEPS) K(eqEl, s.tex); { const fx = document.getElementById('fx'); let m = 0; for (const s of STEPS) { K(eqEl, s.tex); m = Math.max(m, fx.getBoundingClientRect().height) } fx.style.minHeight = Math.ceil(m) + 'px'; }
// 中值点 ξ：f'(ξ) 等于弦斜率
function xi(x0, x1) { const k = (f(x1) - f(x0)) / (x1 - x0); let best = (x0 + x1) / 2, e = 1e9; for (let j = 1; j < 200; j++) { const x = x0 + (x1 - x0) * j / 200, d = Math.abs(df(x) - k); if (d < e) { e = d; best = x } } return best; }
const poly = (n, x) => { const hs = (b - a) / n, i = Math.min(n - 1, Math.floor((x - a) / hs)), x0 = a + i * hs; return f(x0) + (f(x0 + hs) - f(x0)) * (x - x0) / hs; };
const v = P.view(FULL, { l: 12, r: 12, t: 12, b: 20 });
const S = { prev: 6, n: 6, mode: 'split', a: { split: 1, chord: 0, zoom: 0, sum: 0 }, intro: 0 };
let st;
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  if (!st) return false; v.w = w; v.h = h;
  const anim = st.tick(dt), intro = P.approach(S, 'intro', 1, dt, 4), p = P.ease.inOut(st.p);
  const m = S.mode, n = S.n, hs = (b - a) / n;
  // 各层透明度的目标
  const want = { split: m === 'split' || m === 'zoom' ? 1 : 0, chord: m === 'split' ? 0 : 1, zoom: m === 'zoom' ? 1 : 0, sum: m === 'sum' ? 1 : 0 };
  let mv = false; for (const k in want) mv = P.approach(S.a, k, want[k], dt, 5) || mv;
  // 镜头：近似阶段放大第 PIECE 段
  const x0 = a + PIECE * 1, x1 = x0 + 1;
  if (m === 'zoom') { let lo = 1e9, hi = -1e9; for (let j = 0; j <= 40; j++) { const y = f(x0 + j / 40); lo = Math.min(lo, y); hi = Math.max(hi, y) } const sp = Math.max(hi - lo, .5); v.aim([x0 - .45, x1 + .45, lo - .45 * sp, hi + .45 * sp]) } else v.aim(FULL);
  const cam = v.step(dt, 4);
  P.axes(ctx, v, { x: true });
  // 分点与竖直虚线
  for (let i = 0; i <= n; i++) { const x = a + i * hs; P.path(ctx, [[v.X(x), v.Y(0)], [v.X(x), v.Y(f(x))]], { color: C.mute, width: 1, dash: [3, 4], alpha: .5 * S.a.split * intro }) }
  P.path(ctx, P.curve(v, f, a, b), { color: C.accent, width: 2.4, progress: P.ease.out(S.intro) });
  // 弦（折线）：加密时顶点从旧折线滑到曲线
  const pts = []; for (let i = 0; i <= n; i++) { const x = a + i * hs, y = m === 'lim' ? P.lerp(poly(S.prev, x), f(x), p) : f(x); pts.push([v.X(x), v.Y(y)]) }
  const sumProg = m === 'sum' ? P.ease.inOut(st.p) : 1;
  P.path(ctx, pts, { color: C.warm, width: 2, alpha: S.a.chord, progress: sumProg });
  pts.forEach((q, i) => P.dot(ctx, q[0], q[1], { r: n > 20 ? 2.2 : 3.4, color: C.warm, alpha: Math.max(S.a.split, S.a.chord) * S.intro, ring: n <= 20 }));
  // 近似阶段：Δx、Δy 直角与 ξ 处的切线
  const za = S.a.zoom;
  if (za > .01) {
    const y0 = f(x0), y1 = f(x1), xm = xi(x0, x1), ym = f(xm), k = df(xm), e = .7;
    P.path(ctx, [[v.X(x0), v.Y(y0)], [v.X(x1), v.Y(y0)], [v.X(x1), v.Y(y1)]], { color: C.soft, width: 1.2, dash: [4, 4], alpha: za });
    P.path(ctx, [[v.X(xm - e), v.Y(ym - k * e)], [v.X(xm + e), v.Y(ym + k * e)]], { color: C.blue, width: 1.8, dash: [6, 5], alpha: za });
    P.dot(ctx, v.X(xm), v.Y(ym), { r: 4, color: C.blue, alpha: za });
    lab.set('dx', '\\Delta x_i', (v.X(x0) + v.X(x1)) / 2, v.Y(y0), { dy: y1 > y0 ? 14 : -14, color: C.soft, size: 13, alpha: za });
    lab.set('dy', '\\Delta y_i', v.X(x1), (v.Y(y0) + v.Y(y1)) / 2, { dx: 22, color: C.soft, size: 13, alpha: za });
    lab.set('M0', 'M_{i-1}', v.X(x0), v.Y(y0), { dx: -22, dy: -10, color: C.warm, size: 13, alpha: za });
    lab.set('M1', 'M_i', v.X(x1), v.Y(y1), { dx: 14, dy: -12, color: C.warm, size: 13, alpha: za });
    lab.set('xi', '\\xi_i', v.X(xm), v.Y(ym), { dy: 16, color: C.blue, size: 13, alpha: za });
  }
  lab.set('a', 'a', v.X(a), v.Y(0), { dy: 12, color: C.soft, size: 13, alpha: 1 - za });
  lab.set('b', 'b', v.X(b), v.Y(0), { dy: 12, color: C.soft, size: 13, alpha: 1 - za });
  lab.end();
  return anim || intro || mv || cam;
});
st = P.stepper(document.getElementById('nav'), { count: STEPS.length, dur: 1.1, hold: 1.1, kick: cv.kick, onChange: s => {
  const T = STEPS[s.i]; S.prev = s.p < 1 ? S.n : T.n; S.n = T.n; S.mode = T.mode; K(eqEl, T.tex) } });
K(eqEl, STEPS[0].tex);
const off = new IntersectionObserver(e => { if (!e[0].isIntersecting) st.stop() }); off.observe(document.querySelector('main'));
cv.kick();
P.reportHeight(document.querySelector('main'));
</script></body></html>
