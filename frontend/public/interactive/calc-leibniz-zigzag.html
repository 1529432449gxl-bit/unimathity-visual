<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alternating series</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>main{max-width:900px;margin:auto}.stage canvas{height:340px}@media(max-width:520px){.stage canvas{height:290px}}</style></head>
<body><main>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="partial sums of 1-1/2+1/3-... squeeze to ln 2"></canvas></div>
<div class="legend" id="legend"></div>
<div class="fx" id="fx"><div id="eq"></div></div>
<div class="nav" id="nav"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s) => katex.render(s, el, { throwOnError: false });
const N = 40, L = Math.log(2);
const Sn = [0]; for (let n = 1; n <= N; n++) Sn.push(Sn[n - 1] + (n % 2 ? 1 : -1) / n);
// 每一步加入的项数：前面逐项，后面成批
const marks = [1, 2, 3, 4, 5, 6, 8, 10, 13, 17, 22, 28, 34, 40];
const stage = document.getElementById('stage'), lab = P.labels(stage);
for (const [t, c] of [['S_{2m+1}', C.warm], ['S_{2m}', C.blue], ['\\ln 2', C.accent]]) {
  const e = document.createElement('span'); e.className = 'key'; e.style.setProperty('--c', c); K(e, t); document.getElementById('legend').append(e);
}
K(document.getElementById('eq'), 'S_{2m}\\ \\leqslant\\ \\ln 2\\ \\leqslant\\ S_{2m+1},\\qquad |R_n|\\leqslant a_{n+1}');
const v = P.view([0, N + 1, -0.05, 1.08], { l: 14, r: 16, t: 14, b: 22 });
const S = { k: 1, intro: 0, map: 0 };
let st;
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  if (!st) return false; v.w = w; v.h = h;
  const anim = st.tick(dt), mv = P.approach(S, 'k', marks[st.i], dt, 4), intro = P.approach(S, 'intro', 1, dt, 4);
  const k = S.k, kn = Math.floor(k), fr = k - kn;
  // 镜头跟随最近的十来项：横向平移、纵向收紧
  const x0 = Math.max(0, kn - 10), x1 = Math.max(8, kn + 3);
  let lo = L, hi = L; for (let n = Math.max(1, x0); n <= kn; n++) { lo = Math.min(lo, Sn[n]); hi = Math.max(hi, Sn[n]) }
  if (kn <= 2) { lo = Math.min(lo, 0); }
  const pad = Math.max(0.12 * (hi - lo), 0.01);
  const rg = hi - lo + 2 * pad; v.aim([x0, x1, lo - pad - (kn > 3 ? 0.62 * rg : 0), hi + pad]); const cam = v.step(dt, 4);
  P.path(ctx, [[v.X(0), v.Y(L)], [w, v.Y(L)]], { color: C.accent, width: 1.6, dash: [6, 5], alpha: .8 });
  // 包络：奇数项部分和下降、偶数项部分和上升
  const odd = [], even = [];
  for (let n = 1; n <= kn; n++) (n % 2 ? odd : even).push([v.X(n), v.Y(Sn[n])]);
  P.path(ctx, odd, { color: C.warm, width: 1.2, alpha: .45 });
  P.path(ctx, even, { color: C.blue, width: 1.2, alpha: .45 });
  // 锯齿：S_{n-1} → S_n
  const zig = [[v.X(0), v.Y(0)]]; for (let n = 1; n <= kn; n++) zig.push([v.X(n), v.Y(Sn[n])]);
  if (kn < N && fr > 0) zig.push([v.X(kn + fr), v.Y(P.lerp(Sn[kn], Sn[kn + 1], fr))]);
  P.path(ctx, zig, { color: C.soft, width: 1.2, alpha: .5 * S.intro });
  for (let n = 1; n <= kn; n++) P.dot(ctx, v.X(n), v.Y(Sn[n]), { r: n === kn ? 4.6 : 3.2, color: n % 2 ? C.warm : C.blue, alpha: n === kn ? 1 : .8 });
  // 最近两项之间的区间：长度为下一项 a_{n+1}
  if (kn >= 2) {
    const xb = v.X(kn) + 16, y1 = v.Y(Sn[kn]), y2 = v.Y(Sn[kn - 1]);
    P.path(ctx, [[xb, y1], [xb, y2]], { color: C.hl, width: 3, alpha: .8 });
    P.path(ctx, [[v.X(kn - 1), y2], [xb, y2]], { color: C.hl, width: 1, dash: [3, 3], alpha: .6 });
    P.path(ctx, [[v.X(kn), y1], [xb, y1]], { color: C.hl, width: 1, dash: [3, 3], alpha: .6 });
  }
  // 整体小图：全部部分和与当前镜头框
  const FULLB = [0, N + 1, 0.42, 1.06];
  const zoomed = kn > 3;
  const mm = P.approach(S, 'map', zoomed ? 1 : 0, dt, 5);
  P.minimap(ctx, v, { B: FULLB, alpha: S.map || 0, corner: 'bl', frac: .3, aspect: .55, paint: (mx, my, c) => {
    c.save(); c.setLineDash([3, 3]); c.strokeStyle = P.rgba(C.accent, .6); c.lineWidth = 1; c.beginPath(); c.moveTo(mx(0), my(L)); c.lineTo(mx(N + 1), my(L)); c.stroke(); c.restore();
    const z = []; for (let n = 1; n <= kn; n++) z.push([mx(n), my(Sn[n])]);
    P.path(c, z, { color: C.soft, width: 1, alpha: .6 });
    for (let n = 1; n <= kn; n++) P.dot(c, mx(n), my(Sn[n]), { r: 1.6, color: n % 2 ? C.warm : C.blue, ring: false });
  } });
  lab.set('L', '\\ln 2', 0, v.Y(L), { dx: 30, dy: -11, color: C.accent, size: 13 });
  lab.end();
  return anim || mv || intro || cam || mm;
});
st = P.stepper(document.getElementById('nav'), { count: marks.length, dur: 1.1, hold: .7, kick: cv.kick });
const off = new IntersectionObserver(e => { if (!e[0].isIntersecting) st.stop() }); off.observe(document.querySelector('main'));
cv.kick();
P.reportHeight(document.querySelector('main'));
</script></body></html>
