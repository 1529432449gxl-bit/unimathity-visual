<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cantor function</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{height:380px}@media(max-width:520px){canvas#cv{height:340px}}</style></head>
<body><main>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Plateaus on removed intervals are added level by level, turning a line into the devil's staircase"></canvas></div>
<div class="nav" id="nav"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P;
const LV = 8, M = 1200, xs = Array.from({ length: M + 1 }, (_, j) => j / M);
// 第 n 步：在前 n 层去掉的区间上取平台值，其余部分线性连接
function cn(x, n) { if (n === 0) return x; if (x < 1 / 3) return cn(3 * x, n - 1) / 2; if (x <= 2 / 3) return .5; return .5 + cn(3 * x - 2, n - 1) / 2 }
const removed = [[]]; let segs = [[0, 1]];
for (let k = 1; k <= LV; k++) { const out = [], rem = []; for (const [a, b] of segs) { const t = (b - a) / 3; out.push([a, a + t], [b - t, b]); rem.push([a + t, b - t]) } segs = out; removed.push(rem) }
const st = { y: xs.slice() };
const v = P.view([0, 1, -.04, 1.04], { l: 16, r: 16, t: 10, b: 20 });
let player;
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  const s = Math.min(w - 32, h - 30); v.pad = { l: (w - s) / 2, r: (w - s) / 2, t: 10, b: 20 }; v.w = w; v.h = h;
  const moving = player.tick(dt), n = player.i, p = player.p;
  const mv = P.approach(st, 'y', xs.map(x => cn(x, n)), dt, 5);
  P.path(ctx, [[v.X(0), v.Y(0)], [v.X(1), v.Y(0)]], { color: C.rule, width: 1 }); P.path(ctx, [[v.X(0), v.Y(0)], [v.X(0), v.Y(1)]], { color: C.rule, width: 1 });
  P.path(ctx, [[v.X(0), v.Y(0)], [v.X(1), v.Y(1)]], { color: C.mute, width: 1, dash: [3, 4], alpha: .5 });
  P.path(ctx, xs.map((x, j) => [v.X(x), v.Y(st.y[j])]), { color: C.accent, width: 2.4, halo: 2 });
  // 本步新增的平台：橙色，逐渐淡入后转为深蓝
  if (n > 0) for (const [a, b] of removed[n]) { const y = cn((a + b) / 2, n), pop = P.ease.out(P.seg(p, .2, .8));
    P.path(ctx, [[v.X(a), v.Y(y)], [v.X(b), v.Y(y)]], { color: C.warm, width: 3.4, alpha: pop * (1 - .5 * P.seg(p, .85, 1)) });
    P.path(ctx, [[v.X(a), v.Y(0) + 6], [v.X(b), v.Y(0) + 6]], { color: C.warm, width: 3, alpha: pop }) }
  return moving || mv;
});
player = P.stepper(document.getElementById('nav'), { count: LV + 1, dur: 1.5, hold: .7, kick: cv.kick });
player.playing = true; player.go(0, false); player.wait = .7; cv.kick();
P.reportHeight(document.querySelector('main'));
</script></body></html>
