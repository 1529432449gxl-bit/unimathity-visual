<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Normal subgroups, quotient groups and homomorphisms</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{height:350px}@media(max-width:520px){canvas#cv{height:300px}}.fx .katex-display{margin:0}</style></head>
<body><main>
<div class="top"><button type="button" class="tg" data-m="normal" aria-pressed="true">Normal</button><button type="button" class="tg" data-m="quotient" aria-pressed="false">Quotient</button><button type="button" class="tg" data-m="hom" aria-pressed="false">Homomorphism</button></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Conjugation keeps a normal subgroup in place; coset products do not depend on representatives; a homomorphism collapses each coset of its kernel to one point"></canvas></div>
<div class="fx" id="fx"></div>
<div class="nav" id="nav"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s) => katex.render(s, el, { throwOnError: false, displayMode: true });
// 二面体群 D_6（阶 12）：元素 r^k s^f 记作 {k,f}；s r^k = r^{-k} s。正规子群 N=⟨r²⟩，商群 G/N 有 4 个元素。
const n = 6, G = [];

const cosetOf = g => REPS.findIndex(a => N.some(h => mul(a, h) === g));
const colEls = REPS.map(a => N.map(h => mul(a, h)));          // 每个陪集一列，列内顺序按 N 的元素
// ---------- 三种模式的步骤脚本 ----------
const conjSteps = (g, S) => S.map(h => ({ from: h, to: conj(g, h) }));
const pairs = [[at(1, 0), at(0, 1)], [at(3, 0), at(2, 1)], [at(5, 0), at(4, 1)]];
const SCRIPT = {
  normal: [
    { set: N, f: ['N=\\langle r^2\\rangle', 'N=\\{e,r^2,r^4\\}'] },
    { set: N, g: at(0, 1), fly: conjSteps(at(0, 1), N), f: ['gNg^{-1}=\\{ghg^{-1}\\mid h\\in N\\}', 'sNs^{-1}=N'] },
    { set: N, g: at(1, 1), fly: conjSteps(at(1, 1), N), f: ['gNg^{-1}=\\{ghg^{-1}\\mid h\\in N\\}', '(rs)N(rs)^{-1}=N'] },
    { set: Ks, f: ['K=\\langle s\\rangle', 'K=\\{e,s\\}'] },
    { set: Ks, g: at(1, 0), fly: conjSteps(at(1, 0), Ks), bad: true, f: ['rKr^{-1}=\\{e,\\ r^2s\\}', 'rKr^{-1}\\ne K'] },
    { set: N, all: true, f: ['N\\lhd G\\iff gNg^{-1}=N\\quad \\forall g\\in G', 'gN=Ng'] },
  ],
  quotient: [
    { f: ['G/N=\\{N,\\ rN,\\ sN,\\ rsN\\}', '(aN)(bN)=(ab)N'] },
    { sel: true, f: ['(rN)(sN)=(rs)N', '\\phantom{r}'] },
    { sel: true, pair: 0, f: ['(rN)(sN)=(rs)N', 'r\\cdot s=rs'] },
    { sel: true, pair: 1, f: ['(rN)(sN)=(rs)N', 'r^3\\cdot r^2s=r^5s'] },
    { sel: true, pair: 2, f: ['(rN)(sN)=(rs)N', 'r^5\\cdot r^4s=r^3s'] },
    { sel: true, rain: true, f: ['a\'\\in aN,\\ b\'\\in bN\\ \\Longrightarrow\\ a\'b\'\\in abN', '(aN)(bN)=(ab)N'] },
  ],
  hom: [
    { f: ['\\phi:G\\to G\',\\qquad \\ker\\phi=N', '\\phi(aN)=\\{\\phi(a)\\}'] },
    { col: 0, f: ['\\ker\\phi=N\\ \\longmapsto\\ e\'', '\\phi(h)=e\'\\quad \\forall h\\in N'] },
    { col: 1, f: ['rN\\ \\longmapsto\\ \\phi(r)', '\\phi(rh)=\\phi(r)\\,\\phi(h)=\\phi(r)'] },
    { col: 2, f: ['sN\\ \\longmapsto\\ \\phi(s)', '\\phi(sh)=\\phi(s)'] },
    { col: 3, f: ['rsN\\ \\longmapsto\\ \\phi(rs)', '\\phi(rsh)=\\phi(rs)'] },
    { col: 4, iso: true, f: ['G/\\ker\\phi\\ \\cong\\ G\'', 'aN\\ \\longmapsto\\ \\phi(a)'] },
  ],

const fx = document.getElementById('fx'); fx.innerHTML = '<div></div><div></div>';
const formula = (mode, i) => { K(fx.children[0], SCRIPT[mode][i].f[0]); K(fx.children[1], SCRIPT[mode][i].f[1]) };

  const rowGap = Math.min(54, h * .17), col = (c, j) => [x0 + c * colGap, cy - rowGap + j * rowGap - 6];

  placed = true;
  const pos = g => [el[g.i].x, el[g.i].y];
  // 环模式的结构细线

  let hot = new Set(), lift = new Set();

    const showN = sc.set === N, showK = sc.set === Ks;
    anim = P.approach(fade, 'N', showN ? 1 : 0, dt, 5) | P.approach(fade, 'K', showK ? 1 : 0, dt, 5) | anim;
    if (sc.all) { const pulse = .5 + .5 * Math.sin(performance.now() / 320); blob(ctx, N.map(pos), { color: C.accent, alpha: (.06 + .07 * pulse) * P.seg(p, .1, .3), pad: 23 }); anim = true }
    blob(ctx, N.map(pos), { color: C.accent, alpha: .18 * fade.N * I, pad: 16 });
    blob(ctx, Ks.map(pos), { color: C.accent, alpha: .18 * fade.K * I, pad: 16 });
    sc.set.forEach(g => hot.add(g.i));
    if (sc.bad) { const img = sc.fly.map(q => q.to); blob(ctx, img.map(pos), { color: C.warm, alpha: .12 * P.seg(p, .7, 1), pad: 16, line: 1.4, dash: [4, 4] }) }
    if (sc.g) { const [x, y] = pos(sc.g), s = Math.max(0, P.ease.back(P.seg(p, 0, .2)));
      ctx.save(); ctx.strokeStyle = C.hl; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 12 * s, 0, 7); ctx.stroke(); ctx.restore(); lift.add(sc.g.i) }
  } else {

    const sel = !!sc.sel; anim = P.approach(fade, 'sel', sel ? 1 : 0, dt, 5) | anim;
    for (let c = 0; c < 4; c++) {
      const [x, yt] = col(c, 0), yb = col(c, 2)[1];
      let color = C.mute, a = .08;
      if (mode === 'quotient' && fade.sel > .01) { if (c === 1 || c === 2) { color = C.warm; a = .08 + .08 * fade.sel } if (c === 3) { color = C.accent; a = .08 + .07 * fade.sel } }
      if (mode === 'hom') { if (c === 0) { color = C.accent; a = .14 } if (sc.col === c) { color = C.warm; a = .16 } }
      ctx.save(); ctx.globalAlpha = a * I; ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x - 19, yt - 20, 38, yb - yt + 40, 19); ctx.fill(); ctx.restore();
      lab.set('c' + c, CN[c], x, yb + 34, { color: color === C.mute ? C.soft : color, size: 13, alpha: I * (1 - fade.img) });
    }

  }
  if (fade.img > .01) { ctx.save(); ctx.globalAlpha = fade.img * I * .8; ctx.strokeStyle = C.rule; ctx.lineWidth = 1;
    for (const r of [R * .56, R]) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke() } ctx.restore() }
  // 元素点
  G.forEach((g, k) => { const [x, y] = pos(g), a = P.ease.back(P.seg(I, k / 24, k / 24 + .5)), on = hot.has(g.i);
    P.dot(ctx, x, y, { r: on || lift.has(g.i) ? 6 : 4.6, color: on ? C.accent : (mode === 'normal' ? '#b9bbc2' : C.blue), scale: Math.max(0, a) }) });
  // ---------- 飞行动画 ----------
  const ghost = (A, B, t, color, bend = .3, r = 6) => { if (t <= 0) return; const c = [(A[0] + B[0]) / 2 + (cy - (A[1] + B[1]) / 2) * bend, (A[1] + B[1]) / 2 - (cx - (A[0] + B[0]) / 2) * bend - 12];
    const tr = []; for (let q = 0; q <= 8; q++) tr.push(bez(A, c, B, Math.max(0, t - q * .03))); P.path(ctx, tr, { color, width: 3, alpha: t < 1 ? .25 : 0 }); P.dot(ctx, ...bez(A, c, B, t), { r, color }) };
  if (mode === 'normal') {
    if (sc.fly) sc.fly.forEach((q, j) => ghost(pos(q.from), pos(q.to), P.ease.inOut(P.seg(p, .2 + .08 * j, .75 + .05 * j)), C.warm, q.from === q.to ? 0 : .3));
    if (sc.all) G.forEach((g, j) => { const t0 = .02 + j * .06; N.forEach((hh, k) => ghost(pos(hh), pos(conj(g, hh)), P.ease.inOut(P.seg(p, t0, t0 + .3)) * (P.seg(p, t0, t0 + .3) < 1 ? 1 : 0), C.warm, .25, 4)) });
  }
  if (mode === 'quotient' && sc.pair !== undefined || sc.rain) {
    const list = sc.rain ? colEls[1].flatMap(a => colEls[2].map(b => [a, b])) : [pairs[sc.pair]];
    list.forEach(([a, b], j) => {
      const t0 = sc.rain ? j * .07 : .15, A = pos(a), B = pos(b), T = pos(mul(a, b));
      const s1 = P.ease.inOut(P.seg(p, t0, t0 + (sc.rain ? .2 : .35))), s2 = P.ease.inOut(P.seg(p, t0 + (sc.rain ? .2 : .4), t0 + (sc.rain ? .38 : .8)));
      const Mx = [(A[0] + B[0]) / 2, Math.min(A[1], B[1]) - rowGap * .9];
      if (!sc.rain || s2 < 1) { if (s2 <= 0) { ghost(A, Mx, s1, C.warm, 0, 5); ghost(B, Mx, s1, C.warm, 0, 5) } else ghost(Mx, T, s2, C.accent, .1, 6) }
      if (!sc.rain) { ctx.save(); ctx.strokeStyle = C.hl; ctx.lineWidth = 2; for (const Q of [A, B]) { ctx.beginPath(); ctx.arc(...Q, Math.max(0, 11 * P.ease.back(P.seg(p, 0, .15))), 0, 7); ctx.stroke() } ctx.restore();
        if (s2 >= 1) { ctx.save(); ctx.strokeStyle = C.accent; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(...T, 11, 0, 7); ctx.stroke(); ctx.restore() } }
    });
    if (sc.rain) anim = true;
  }
  if (mode === 'hom') {
    // 右侧 G'：4 个像点；已压缩的陪集落在对应点上
    const gx = w * (narrow ? .76 : .76), gR = Math.max(36, Math.min(46, w * .08)), img = [[gx, cy - gR], [gx - gR, cy], [gx + gR, cy], [gx, cy + gR]];
    const doneUpTo = sc.col === undefined ? -1 : (sc.iso ? 3 : sc.col - (p >= 1 ? 0 : 1));
    img.forEach((Q, c) => {
      const lit = c <= doneUpTo, colr = c === 0 ? C.accent : (c === sc.col ? C.warm : C.blue);

    });

    // 陪集到像点的对应：从列顶向上绕过，不穿过其他列
    if (sc.iso) { isoT += dt; anim = true; const c = Math.floor(isoT / 1.3) % 4, u = (isoT % 1.3) / 1.3, a = Math.sin(Math.PI * Math.min(1, u * 1.15)) ;
      const [x, yt] = col(c, 0), yb = col(c, 2)[1];
      ctx.save(); ctx.globalAlpha = .22 * a; ctx.strokeStyle = C.hl; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x - 21, yt - 22, 42, yb - yt + 44, 21); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.globalAlpha = .9 * a; ctx.strokeStyle = C.hl; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(...img[c], 13, 0, 7); ctx.stroke(); ctx.restore();
      const A = [x, yt - 26], B = img[c], M = [(x + B[0]) / 2, Math.min(yt - 26, B[1]) - 34], pts = []; for (let q = 0; q <= 40; q++) pts.push(bez(A, M, B, q / 40));

st = P.stepper(document.getElementById('nav'), { count: SCRIPT.normal.length, dur: 2.2, hold: .9, kick: cv.kick, onChange: s => formula(mode, s.i) });
document.getElementById('nav').addEventListener('click', () => { touched = true });
function setMode(m, auto) {
  mode = m; document.querySelectorAll('.tg').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === m)));
  st.stop(); st.reset(SCRIPT[m].length); formula(m, 0); cv.kick();
  if (auto) setTimeout(() => { if (!st.playing) { const t = touched; document.querySelector('.play').click(); touched = t } }, 700);
}
document.querySelectorAll('.tg').forEach(b => b.onclick = () => { touched = true; setMode(b.dataset.m, true) });
const qm = new URLSearchParams(location.search).get('mode'); if (SCRIPT[qm]) setMode(qm, false); else formula('normal', 0);
new IntersectionObserver(es => { if (es[0].isIntersecting) { if (!touched && !st.playing) setTimeout(() => { if (!touched && !st.playing) { document.querySelector('.play').click(); touched = false } }, 1300) } else st.stop() }, { threshold: .4 }).observe(cvEl);
document.fonts.ready.then(() => { lockFx(); formula(mode, st.i) });
P.reportHeight(document.querySelector('main'));
</script></body></html>
