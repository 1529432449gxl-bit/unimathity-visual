<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riemann strips and Lebesgue layers</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{height:320px}@media(max-width:520px){canvas#cv{height:520px}}</style></head>
<body><main>
<div class="controls"><span class="n" id="ln"></span><input id="n" type="range" min="3" max="28" step="1" value="6" aria-label="partition"></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Left: vertical Riemann strips. Right: horizontal Lebesgue layers and the level set of one layer"></canvas></div>
<div class="nav" id="nav"><button type="button" class="play" aria-pressed="true">Pause</button></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s) => katex.render(s, el, { throwOnError: false });
K(document.getElementById('ln'), 'n');
const f = x => 1.2 + .7 * Math.sin(2 * Math.PI * (x * 1.4 - .05)) + .35 * Math.sin(2 * Math.PI * 3.3 * x) + .4 * x;
const YM = 2.6, M = 500, xs = Array.from({ length: M + 1 }, (_, j) => j / M);
const sl = document.getElementById('n'); let playing = true, clock = 0, hl = 0;
const st = { a: xs.map(() => 0), b: xs.map(() => 0) };
const lab = P.labels(document.getElementById('stage'));
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  if (playing) { clock += dt; sl.value = Math.round(3 + 25 * (1 - Math.cos(clock * .35)) / 2); hl = Math.floor(clock * .6) }
  const n = +sl.value, dy = YM / n;
  // 黎曼：每个竖条取下确界；勒贝格：每点取所在层的下沿
  const ra = xs.map(x => { const i = Math.min(n - 1, Math.floor(x * n)); let m = Infinity; for (let k = 0; k <= 12; k++) m = Math.min(m, f((i + k / 12) / n)); return m });
  const rb = xs.map(x => Math.floor(f(x) / dy) * dy);
  const mv = P.approach(st, 'a', ra, dt, 8) | P.approach(st, 'b', rb, dt, 8);
  const stack = w < 520, Wp = stack ? w : w / 2, Hp = stack ? h / 2 : h;
  const panel = (ox, oy, arr, col, k) => {
    const v = P.view([0, 1, -.08, YM + .1], { l: 12, r: 12, t: 10, b: 20 }); v.w = Wp; v.h = Hp;
    ctx.save(); ctx.translate(ox, oy); P.axes(ctx, v, { x: true });
    const top = xs.map((x, j) => [v.X(x), v.Y(arr[j])]);
    P.fill(ctx, top, xs.map(x => [v.X(x), v.Y(0)]), P.rgba(col, .22));
    if (k === 0) for (let i = 1; i < n; i++) P.path(ctx, [[v.X(i / n), v.Y(0)], [v.X(i / n), v.Y(st.a[Math.round(i / n * M)])]], { color: C.bg, width: 1 });
    else {
      for (let i = 1; i * dy < YM; i++) P.path(ctx, [[v.X(0), v.Y(i * dy)], [v.X(1), v.Y(i * dy)]], { color: C.bg, width: 1, alpha: .9 });
      // 高亮一层：层带 [lo,hi] 盖在 {f>hi} 上方，这个集合画在横轴下方（层饼公式）
      const kk = hl % Math.max(1, Math.floor(2.2 / dy)), lo = (kk + 1) * dy, hi = lo + dy, segs = []; let s0 = null;
      xs.forEach((x, j) => { const inn = st.b[j] >= hi - 1e-9; if (inn && s0 === null) s0 = x; if (!inn && s0 !== null) { segs.push([s0, x]); s0 = null } }); if (s0 !== null) segs.push([s0, 1]);
      ctx.save(); ctx.fillStyle = P.rgba(C.warm, .55); for (const [a, b] of segs) ctx.fillRect(v.X(a), v.Y(hi), v.X(b) - v.X(a), v.Y(lo) - v.Y(hi)); ctx.restore();
      for (const [a, b] of segs) P.path(ctx, [[v.X(a), v.Y(0) + 7], [v.X(b), v.Y(0) + 7]], { color: C.accent, width: 3.2 });
    }
    P.path(ctx, P.curve(v, f, 0, 1, 300), { color: C.accent, width: 2.4, halo: 2 });
    ctx.restore();
  };
  panel(0, 0, st.a, C.blue, 0); panel(stack ? 0 : Wp, stack ? Hp : 0, st.b, C.warm, 1);
  if (!stack) P.path(ctx, [[Wp, 14], [Wp, h - 14]], { color: C.faint, width: 1 });
  lab.set('R', '\\text{Riemann}', Wp / 2, 12, { color: C.soft, size: 12 });
  lab.set('L', '\\text{Lebesgue}', (stack ? 0 : Wp) + Wp / 2, (stack ? Hp : 0) + 12, { color: C.soft, size: 12 });
  lab.end();
  return playing || mv;
});
const pb = document.querySelector('#nav .play');
const sync = () => { pb.textContent = playing ? 'Pause' : 'Play'; pb.setAttribute('aria-pressed', String(playing)) };
pb.onclick = () => { playing = !playing; sync(); cv.kick() };
sl.addEventListener('input', () => { playing = false; sync(); cv.kick() });
document.addEventListener('visibilitychange', () => { if (document.hidden) { playing = false; sync() } });
P.reportHeight(document.querySelector('main'));
</script></body></html>
