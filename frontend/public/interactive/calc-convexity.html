<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convexity</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script></head>
<body><main>
<div class="top" id="modes"></div>
<div class="controls"><span class="n" id="lab"></span><input id="t" type="range" min="0" max="100" step="1" value="55" aria-label="chord"></div>
<div class="legend"><span class="key" style="--c:#223056" id="kf"></span><span class="key" style="--c:#ad6844" id="kc"></span></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Convexity and chords"></canvas></div>
<div class="fx" id="fx"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s, d) => katex.render(s, el, { throwOnError: false, displayMode: !!d });
const CASES = {
  convex: { f: x => 0.35 * x * x + 0.2, tex: 'f(x)=0.35x^2+0.2', kind: 'convex', ineq: 'f(\\lambda x_1+(1-\\lambda)x_2)\\leqslant\\lambda f(x_1)+(1-\\lambda)f(x_2)' },
  concave: { f: x => 1.4 - 0.35 * x * x, tex: 'f(x)=1.4-0.35x^2', kind: 'concave', ineq: 'f(\\lambda x_1+(1-\\lambda)x_2)\\geqslant\\lambda f(x_1)+(1-\\lambda)f(x_2)' },
};
let mode = 'convex';
const sl = document.getElementById('t'), fx = document.getElementById('fx');
const S = { span: 0.55 };
const v = P.view([-2.2, 2.2, -0.25, 1.85], { l: 16, r: 16, t: 16, b: 26 });
const lab = P.labels(document.getElementById('stage'));
const box = document.getElementById('modes');
[['convex', 'convex'], ['concave', 'concave']].forEach(([id, name]) => {
  const bt = document.createElement('button'); bt.type = 'button'; bt.textContent = name;
  bt.setAttribute('aria-pressed', id === mode);
  bt.onclick = () => {
    mode = id;
    box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === bt));
    legend(); cv.kick();
  };
  box.appendChild(bt);
});
function legend() {
  K(document.getElementById('kf'), CASES[mode].tex);
  K(document.getElementById('kc'), 'chord');
}
legend();
function ends(span) {
  const half = 0.25 + 1.4 * span;
  return [-half, half];
}
function formula(a, b, c) {
  fx.innerHTML = '<div></div>';
  const pos = c.kind === 'convex' ? '\\text{graph below chord}' : '\\text{graph above chord}';
  K(fx.children[0], `${c.ineq}\\quad(${pos})`, true);
}
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  v.w = w; v.h = h;
  const moving = P.approach(S, 'span', +sl.value / 100, dt, 10);
  const c = CASES[mode];
  const [a, b] = ends(S.span);
  K(document.getElementById('lab'), `x_1=${a.toFixed(2)},\\ x_2=${b.toFixed(2)}`);
  formula(a, b, c);
  P.axes(ctx, v, { x: true, ticks: [-1, 0, 1] });
  P.path(ctx, P.curve(v, c.f, -2.05, 2.05), { color: C.accent, width: 2.4 });
  const pa = [v.X(a), v.Y(c.f(a))], pb = [v.X(b), v.Y(c.f(b))];
  const xs = []; for (let i = 0; i <= 80; i++) xs.push(a + (b - a) * i / 80);
  const chordY = xs.map(x => c.f(a) + (c.f(b) - c.f(a)) * (x - a) / (b - a));
  const curveY = xs.map(c.f);
  P.fill(ctx, P.samples(v, chordY, xs), P.samples(v, curveY, xs), C.warm, 0.28);
  P.path(ctx, [pa, pb], { color: C.warm, width: 2.2 });
  P.dot(ctx, ...pa, { r: 4.5, color: C.warm });
  P.dot(ctx, ...pb, { r: 4.5, color: C.warm });
  // midpoint on chord vs on curve
  const xm = (a + b) / 2;
  const pc = [v.X(xm), v.Y(c.f(a) + (c.f(b) - c.f(a)) * 0.5)];
  const pm = [v.X(xm), v.Y(c.f(xm))];
  P.dot(ctx, ...pc, { r: 3.2, color: C.warm, ring: false });
  P.dot(ctx, ...pm, { r: 3.2, color: C.accent, ring: false });
  lab.set('a', 'x_1', pa[0], pa[1], { dy: 16, color: C.warm });
  lab.set('b', 'x_2', pb[0], pb[1], { dy: 16, color: C.warm });
  lab.set('ch', 'chord', pc[0], pc[1], { dy: c.kind === 'convex' ? -12 : 14, color: C.warm });
  lab.set('g', 'f', pm[0], pm[1], { dy: c.kind === 'convex' ? 14 : -12, color: C.accent });
  lab.end();
  return moving;
});
sl.addEventListener('input', () => cv.kick());
{ let m = 0; for (const t of [0, 55, 100]) { const [a, b] = ends(t / 100); formula(a, b, CASES.convex); m = Math.max(m, fx.getBoundingClientRect().height); }
  fx.style.minHeight = Math.ceil(m) + 'px'; }
cv.kick();
P.reportHeight(document.querySelector('main'));
</script></body></html>
