<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polar area</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>main{max-width:900px;margin:auto}.stage canvas{height:360px}@media(max-width:520px){.stage canvas{height:300px}}</style></head>
<body><main>
<div class="controls"><span class="n" id="lab"></span><input id="th" type="range" min="0" max="1000" step="1" value="380" aria-label="theta"><button type="button" class="tg" id="play" aria-pressed="false">Play</button></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="cardioid area swept by thin sectors"></canvas></div>
<div class="legend" id="legend"></div>
<div class="fx" id="fx"><div id="eq"></div></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s) => katex.render(s, el, { throwOnError: false });
const rho = t => 1 + Math.cos(t), TT = 2 * Math.PI, DT = 0.16;
for (const [t, c] of [['\\rho=a(1+\\cos\\theta)', C.accent], ['\\mathrm dA=\\tfrac12\\rho^2\\,\\mathrm d\\theta', C.warm]]) {
  const e = document.createElement('span'); e.className = 'key'; e.style.setProperty('--c', c); K(e, t); document.getElementById('legend').append(e);
}
K(document.getElementById('eq'), 'A=\\frac12\\int_\\alpha^\\beta\\rho(\\theta)^2\\,\\mathrm d\\theta');
const sl = document.getElementById('th'), btn = document.getElementById('play'), stage = document.getElementById('stage');
const S = { t: .38 * TT, target: .38 * TT, playing: false };
const lab = P.labels(stage);
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  if (S.playing) { S.target = Math.min(TT, S.target + 1.1 * dt); if (S.target >= TT) setPlay(false); sl.value = S.target / TT * 1000; }
  const moving = P.approach(S, 't', S.target, dt, 10), th = S.t;
  K(document.getElementById('lab'), `\\theta=${th.toFixed(2)}`);
  // 等比例坐标：极点放在画面中偏左
  const sc = Math.min((w - 40) / 2.9, (h - 30) / 2.8), ox = w / 2 - 0.65 * sc, oy = h / 2;
  const X = (r, t) => ox + sc * r * Math.cos(t), Y = (r, t) => oy - sc * r * Math.sin(t);
  ctx.save(); ctx.strokeStyle = C.rule; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(ox - 0.4 * sc, oy); ctx.lineTo(w - 10, oy); ctx.stroke(); ctx.restore();
  // 已扫过的面积
  ctx.save(); ctx.fillStyle = P.rgba(C.warm, .2); ctx.beginPath(); ctx.moveTo(ox, oy);
  for (let i = 0; i <= 240; i++) { const t = th * i / 240; ctx.lineTo(X(rho(t), t), Y(rho(t), t)) } ctx.closePath(); ctx.fill(); ctx.restore();
  const cur = []; for (let i = 0; i <= 360; i++) { const t = TT * i / 360; cur.push([X(rho(t), t), Y(rho(t), t)]) }
  P.path(ctx, cur, { color: C.accent, width: 2.4 });
  // 当前扇形微元：圆心角 dθ，半径 ρ(θ)
  if (th > 0.02 && th < TT - 0.02) {
    const a = Math.max(0, th - DT), r = rho(th);
    ctx.save(); ctx.fillStyle = P.rgba(C.warm, .6); ctx.strokeStyle = C.warm; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(ox, oy);
    ctx.arc(ox, oy, sc * r, -th, -a); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    P.path(ctx, [[ox, oy], [X(r, th), Y(r, th)]], { color: C.warm, width: 1.6 });
    P.dot(ctx, X(r, th), Y(r, th), { r: 4.2, color: C.warm });
    lab.set('r', '\\rho(\\theta)', (ox + X(r, th)) / 2, (oy + Y(r, th)) / 2, { dx: -16 * Math.sin(th), dy: -16 * Math.cos(th), color: C.warm, size: 13, alpha: r > .35 ? 1 : 0 });
    lab.set('dth', '\\mathrm d\\theta', X(.22, th - DT / 2), Y(.22, th - DT / 2), { dx: 14 * Math.cos(th), dy: -14 * Math.sin(th), color: C.soft, size: 12, alpha: r > .5 ? 1 : 0 });
  }
  P.dot(ctx, ox, oy, { r: 3.4, color: C.soft });
  lab.set('O', 'O', ox, oy, { dx: -10, dy: 12, color: C.soft, size: 13 });
  lab.end();
  return moving || S.playing;
});
function setPlay(on) { S.playing = on; btn.textContent = on ? 'Pause' : 'Play'; btn.setAttribute('aria-pressed', String(on)); if (on) cv.kick(); }
btn.addEventListener('click', () => { if (S.playing) { setPlay(false); return } if (S.target >= TT) { S.target = 0; S.t = 0 } setPlay(true) });
sl.addEventListener('input', () => { setPlay(false); S.target = +sl.value / 1000 * TT; cv.kick() });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPlay(false) });
cv.kick();
P.reportHeight(document.querySelector('main'));
</script></body></html>
