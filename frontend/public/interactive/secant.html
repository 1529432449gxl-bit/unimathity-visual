<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弦截法逐步演示</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script></head>
<body><main>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="弦截法：过两点的割线与 x 轴的交点给出下一个近似值"></canvas></div>
<div class="fx" id="fx"></div>
<div class="nav" id="nav"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s, d) => katex.render(s, el, { throwOnError: false, displayMode: !!d });
const f = x => x ** 3 - 2 * x - 5, ROOT = 2.0945514815423265, N = 5, WIDE = [1.6, 4.0, -12, 50];
const xs = [3.6, 3.2]; for (let k = 1; k <= N; k++) { const a = xs[k - 1], b = xs[k]; xs.push(b - f(b) * (b - a) / (f(b) - f(a))) }
// 第 i 步（i≥1）由 x_{i-1}, x_i 求 x_{i+1}；镜头框住这三点
function frameFor(i) {
  const pts = [xs[i - 1], xs[i], xs[i + 1]], lo = Math.min(...pts), hi = Math.max(...pts), span = Math.max(hi - lo, 1e-5);
  const x0 = lo - span * .35, x1 = hi + span * .25;
  let y0 = 0, y1 = 0; for (let j = 0; j <= 40; j++) { const y = f(x0 + (x1 - x0) * j / 40); y0 = Math.min(y0, y); y1 = Math.max(y1, y) }
  const r = y1 - y0 || 1; return [x0, x1, y0 - r * .12, y1 + r * .2];
}
const v = P.view(WIDE, { l: 16, r: 16, t: 18, b: 30 }), fx = document.getElementById('fx'), lab = P.labels(document.getElementById('stage'));
const d6 = x => x.toFixed(6);
function formula(i) {
  fx.innerHTML = '<div></div><div></div>';
  K(fx.children[0], 'x_{k+1}=x_k-\\dfrac{f(x_k)\\,(x_k-x_{k-1})}{f(x_k)-f(x_{k-1})}', true);
  K(fx.children[1], i === 0 ? `x_0=${xs[0]},\\qquad x_1=${xs[1]}` : `x_{${i + 1}}=${d6(xs[i])}-\\dfrac{${f(xs[i]).toFixed(5)}\\times(${(xs[i] - xs[i - 1]).toFixed(5)})}{${(f(xs[i]) - f(xs[i - 1])).toFixed(5)}}=${d6(xs[i + 1])}`, true);
}
let st; const S = { map: 0 };
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  v.w = w; v.h = h; const moving = st.tick(dt), cam = v.step(dt, 3.2), i = st.i, p = st.p;
  const mapMoving = P.approach(S, 'map', (WIDE[1] - WIDE[0]) / (v.b[1] - v.b[0]) > 2.2 ? 1 : 0, dt, 5);
  P.axes(ctx, v, { x: true });
  P.path(ctx, P.curve(v, f), { color: C.accent, width: 2.4 });
  const ax = x => [v.X(x), v.Y(0)], on = x => [v.X(x), v.Y(f(x))], line = (a, b, t) => { const m = (f(b) - f(a)) / (b - a); return [v.X(t), v.Y(f(b) + m * (t - b))] };
  for (let k = 1; k < i; k++) P.path(ctx, [on(xs[k - 1]), ax(xs[k + 1])], { color: C.warm, width: 1.3, alpha: .3 });
  if (i === 0) {
    for (const [k, x] of [[0, xs[0]], [1, xs[1]]]) { P.path(ctx, [ax(x), on(x)], { color: C.mute, width: 1.2, dash: [3, 4] }); P.dot(ctx, ...on(x), { r: 4.5, color: C.accent }); lab.set('p' + k, `x_{${k}}`, ...ax(x), { dy: 16, color: C.soft }) }
  } else {
    const a = xs[i - 1], b = xs[i], c = xs[i + 1], pa = P.ease.inOut(P.seg(p, 0, .3)), pb = P.ease.inOut(P.seg(p, .3, .78)), pc = P.seg(p, .72, 1);
    for (const x of [a, b]) { P.path(ctx, [ax(x), on(x)], { color: C.mute, width: 1.2, dash: [3, 4], progress: pa }); P.dot(ctx, ...on(x), { r: 4.5, color: C.accent, scale: P.ease.back(P.seg(p, .1, .35)) }) }
    const far = a > b ? a : b, t0 = far + (far - c) * .15, t1 = c - (Math.max(a, b) - c) * .2;
    P.path(ctx, [line(a, b, t0), ax(c)], { color: C.warm, width: 2.2, progress: pb });
    P.path(ctx, [ax(c), line(a, b, t1)], { color: C.warm, width: 1.4, alpha: .5 * pc });
    P.dot(ctx, ...ax(c), { r: 4.5, color: C.warm, scale: P.ease.back(pc) });
    lab.set('p0', `x_{${i - 1}}`, ...ax(a), { dy: f(a) < 0 ? -16 : 16, color: C.soft }); lab.set('p1', `x_{${i}}`, ...ax(b), { dy: f(b) < 0 ? -16 : 16, color: C.soft });
    lab.set('p2', `x_{${i + 1}}`, ...ax(c), { dy: 16, color: C.warm, alpha: pc });
  }
  P.minimap(ctx, v, { B: WIDE, alpha: S.map, paint: (mx, my, c) => {
    P.path(c, [[mx(WIDE[0]), my(0)], [mx(WIDE[1]), my(0)]], { color: C.rule, width: 1 }); P.mapCurve(c, mx, my, f, WIDE[0], WIDE[1]);
    for (let k = 0; k <= i + 1; k++) P.dot(c, mx(xs[k]), my(0), { r: 2, color: k === i + 1 ? C.warm : C.mute, ring: false }) } });
  lab.end();
  return moving || cam || mapMoving;
});
st = P.stepper(document.getElementById('nav'), { count: N, dur: 1.9, hold: .7, kick: cv.kick, onChange: s => { v.aim(s.i === 0 ? WIDE : frameFor(s.i)); formula(s.i) } });
{ let m = 0; for (let i = 0; i < N; i++) { formula(i); m = Math.max(m, fx.getBoundingClientRect().height) } fx.style.minHeight = Math.ceil(m) + 'px' }
st.go(0, false);
P.reportHeight(document.querySelector('main'));
</script></body></html>
