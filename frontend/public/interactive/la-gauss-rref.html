<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gauss elimination</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script><script src="vendor/lasteps.js"></script>
</head><body><main></main>
<script>
const {gen,sub,isV,isC}=LAS;
const R=['1','2','\\vdots','r','r+1','\\vdots','s'], Cc=['1','2','\\cdots','r','r+1','\\cdots','n'];
const ord=x=>({'1':1,'2':2,'r':50,'r+1':51,'s':99,'n':99})[x]??null;
const ROWS=R.length, AUG=Cc.length;
// 前 k 列消元后的增广矩阵
function stage(k){
  const A=gen(R,Cc,(r,c,i,j,m)=>{
    const ri=ord(r),cj=ord(c);
    if(m==='v'){ if(cj!==null&&cj<=k)return '0'; return null }
    if(m==='c'){ return null }
    if(cj<=k&&ri>cj)return '0';
    const s=Math.min(ri-1,k);
    return s===0?`a_${sub(r,c)}`:`a^{(${s})}_${sub(r,c)}`;
  });
  A.forEach((row,i)=>{const r=R[i];if(isV(r)){row.push('\\vdots');return}const s=Math.min(ord(r)-1,k);row.push(s===0?`b_{${r}}`:`b^{(${s})}_{${r}}`)});
  return A;
}
// 阶梯形 (U|g)：主元在前 r 列，第 r+1 行以下全零
function echelon(){
  const A=gen(R,Cc,(r,c,i,j,m)=>{
    const ri=ord(r),cj=ord(c);
    if(m==='v'){ if(i>4)return null; if(cj!==null&&cj<=2)return '0'; return null}
    if(ri>50){ return m==='c'?'\\cdots':'0' }
    if(m==='c'){ return (ri===50)?'\\cdots':null }
    if(cj<ri)return '0';
    return `u_${sub(r,c)}`;
  });
  A.forEach((row,i)=>{const r=R[i];row.push(isV(r)?'\\vdots':ord(r)>50?'0':`g_{${r}}`)});
  return A;
}
// 行最简形 (R|d)
function rref(partial){
  const A=gen(R,Cc,(r,c,i,j,m)=>{
    const ri=ord(r),cj=ord(c);
    if(m==='v'){ if(i>4)return null; if(cj!==null&&cj<=2)return '0'; return cj!==null&&cj>50?null:null}
    if(ri>50){ return m==='c'?'\\cdots':'0' }
    if(m==='c'){ if(ri===50)return cj===null&&j<4?'\\cdots':'\\cdots'; return null }
    if(cj>50||(cj===51))return `c_${sub(r,c)}`;
    if(partial&&ri<50&&cj===50)return `u_${sub(r,c)}`;
    if(partial&&ri<50&&cj>ri)return `u_${sub(r,c)}`;
    if(cj===ri)return '1';
    if(cj<ri)return '0';
    return '0';
  });
  A.forEach((row,i)=>{const r=R[i];row.push(isV(r)?'\\vdots':ord(r)>50?'0':partial&&ord(r)<50?`g_{${r}}`:`d_{${r}}`)});
  return A;
}
const M=(cells,label)=>({key:'A',label,cells,aug:AUG});
const col=(j,from,to,c)=>R.map((r,i)=>i>=from&&i<=to?['A',i,j,c]:null).filter(Boolean);
const rowHi=(i,c,j0=0,j1=AUG)=>[...Array(j1-j0+1)].map((_,t)=>['A',i,j0+t,c]);
const steps=[];
steps.push({mats:[M(stage(0),'(A\\mid b)')],hi:[],lines:['(A\\mid b)']});
steps.push({mats:[M(stage(0),'(A\\mid b)')],hi:[['A',0,0,'s'],...col(0,1,ROWS-1,'t')],lines:['r_i-\\dfrac{a_{i1}}{a_{11}}\\,r_1\\qquad(i=2,\\cdots,s)']});
steps.push({mats:[M(stage(1),'(A^{(1)}\\mid b^{(1)})')],hi:[...col(0,1,ROWS-1,'p')],lines:['a^{(1)}_{ij}=a_{ij}-\\dfrac{a_{i1}}{a_{11}}\\,a_{1j}']});
steps.push({mats:[M(stage(1),'(A^{(1)}\\mid b^{(1)})')],hi:[['A',1,1,'s'],...col(1,2,ROWS-1,'t')],lines:['r_i-\\dfrac{a^{(1)}_{i2}}{a^{(1)}_{22}}\\,r_2\\qquad(i=3,\\cdots,s)']});
steps.push({mats:[M(stage(2),'(A^{(2)}\\mid b^{(2)})')],hi:[...col(1,2,ROWS-1,'p')],lines:['a^{(2)}_{ij}=a^{(1)}_{ij}-\\dfrac{a^{(1)}_{i2}}{a^{(1)}_{22}}\\,a^{(1)}_{2j}']});
const E=echelon();
steps.push({mats:[M(E,'(U\\mid g)')],hi:[['A',0,0,'s'],['A',1,1,'s'],['A',3,3,'s'],...rowHi(4,'p'),...rowHi(6,'p')],lines:['u_{11},\\ u_{22},\\ \\cdots,\\ u_{rr}\\neq0','\\text{rows } r+1,\\cdots,s\\ \\text{vanish}']});
steps.push({mats:[M(E,'(U\\mid g)')],hi:[['A',3,3,'s'],['A',0,3,'t'],['A',1,3,'t']],lines:['\\dfrac{1}{u_{rr}}\\,r_r,\\qquad r_i-u_{ir}\\,r_r\\quad(i<r)']});
const F=rref(false);
steps.push({mats:[M(F,'(R\\mid d)')],hi:[['A',0,0,'s'],['A',1,1,'s'],['A',3,3,'s']],lines:['\\text{pivots}=1,\\quad\\text{other entries in pivot columns}=0']});
steps.push({mats:[M(F,'(R\\mid d)')],hi:[...[0,1,3].map(i=>['A',i,AUG,'t']),...[0,1,3].map(i=>['A',i,4,'s']),...[0,1,3].map(i=>['A',i,6,'s'])],lines:['x_i=d_i-c_{i,r+1}\\,x_{r+1}-\\cdots-c_{in}\\,x_n\\qquad(i=1,\\cdots,r)']});
steps.push({mats:[M(F,'(R\\mid d)')],hi:[...[0,1,3].map(i=>['A',i,4,'t'])],lines:['x_{r+1}=1,\\ \\text{other free unknowns}=0','\\eta_1=(-c_{1,r+1},\\,\\cdots,\\,-c_{r,r+1},\\,1,\\,0,\\,\\cdots,\\,0)^{\\prime}']});
steps.push({mats:[M(F,'(R\\mid d)')],hi:[...[0,1,3].map(i=>['A',i,6,'t'])],lines:['x_n=1,\\ \\text{other free unknowns}=0','\\eta_{n-r}=(-c_{1n},\\,\\cdots,\\,-c_{rn},\\,0,\\,\\cdots,\\,0,\\,1)^{\\prime}']});
steps.push({mats:[M(F,'(R\\mid d)')],hi:[...[0,1,3].map(i=>['A',i,AUG,'t'])],lines:['\\gamma_0=(d_1,\\,\\cdots,\\,d_r,\\,0,\\,\\cdots,\\,0)^{\\prime}','x=\\gamma_0+k_1\\eta_1+k_2\\eta_2+\\cdots+k_{n-r}\\eta_{n-r}']});
LAS.run({steps,interval:1700});
</script></body></html>
