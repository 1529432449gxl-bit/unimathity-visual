<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L'Hopital</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script></head>
<body><main>
<div class="top" id="modes"></div>
<div class="controls"><span class="n" id="lab"></span><input id="t" type="range" min="0" max="100" step="1" value="55" aria-label="x"></div>
<div class="legend"><span class="key" style="--c:#223056" id="k1"></span><span class="key" style="--c:#3f6e8c" id="k2"></span><span class="key dash" style="--c:#ad6844" id="k3"></span><span class="key dash" style="--c:#b5763a" id="k4"></span></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="L'Hopital rule"></canvas></div>
<div class="fx" id="fx"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s, d) => katex.render(s, el, { throwOnError: false, displayMode: !!d });
const CASES = {
  '0/0': {
    f: Math.sin, F: x => x, df: Math.cos, dF: () => 1,
    texf: '\\sin x', texF: 'x', L: 1,
    xOf: u => 0.08 + 2.4 * (1 - u),
    box: [-0.2, 2.6, -0.55, 1.55],
    limTex: 'x\\to 0^+',
  },
  'inf/inf': {
    f: Math.log, F: x => x, df: x => 1 / x, dF: () => 1,
    texf: '\\ln x', texF: 'x', L: 0,
    xOf: u => 2 + 18 * u,
    box: [1.5, 22, -0.5, 22],
    limTex: 'x\\to +\\infty',
  },
};
let mode = '0/0';
const sl = document.getElementById('t'), fx = document.getElementById('fx');
const S = { u: 0.55 };
const v = P.view(CASES[mode].box.slice(), { l: 22, r: 18, t: 16, b: 26 });
const lab = P.labels(document.getElementById('stage'));
const box = document.getElementById('modes');
[['0/0', '0/0'], ['inf/inf', '\\infty/\\infty']].forEach(([id, tex]) => {
  const bt = document.createElement('button'); bt.type = 'button';
  bt.setAttribute('aria-pressed', id === mode);
  const sp = document.createElement('span'); K(sp, tex); bt.appendChild(sp);
  bt.onclick = () => {
    mode = id;
    box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === bt));
    S.u = +sl.value / 100;
    v.aim(CASES[mode].box.slice(), false);
    legend(); cv.kick();
  };
  box.appendChild(bt);
});
function legend() {
  const c = CASES[mode];
  K(document.getElementById('k1'), `f=${c.texf}`);
  K(document.getElementById('k2'), `F=${c.texF}`);
  K(document.getElementById('k3'), "f'");
  K(document.getElementById('k4'), "F'");
}
legend();
function fmt(z) { return Number.isFinite(z) ? z.toFixed(3) : '\\text{—}'; }
function formula(c, x) {
  fx.innerHTML = '<div></div><div></div>';
  const r = c.F(x) === 0 ? NaN : c.f(x) / c.F(x);
  const rp = c.dF(x) === 0 ? NaN : c.df(x) / c.dF(x);
  K(fx.children[0], `\\displaystyle\\lim_{${c.limTex}}\\dfrac{f}{F}=\\lim_{${c.limTex}}\\dfrac{f'}{F'}=${c.L}`, true);
  K(fx.children[1], `x=${x.toFixed(2)}:\\quad \\dfrac{f(x)}{F(x)}=${fmt(r)},\\quad \\dfrac{f'(x)}{F'(x)}=${fmt(rp)}`, true);
}
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  v.w = w; v.h = h;
  const c = CASES[mode];
  const moving = P.approach(S, 'u', +sl.value / 100, dt, 10);
  const cam = v.step(dt, 4);
  const x = c.xOf(S.u);
  K(document.getElementById('lab'), `x=${x.toFixed(2)}`);
  formula(c, x);
  P.axes(ctx, v, { x: true });
  const xLo = Math.max(c.box[0], mode === 'inf/inf' ? 1.2 : c.box[0]);
  const xHi = c.box[1];
  P.path(ctx, P.curve(v, c.f, xLo, xHi), { color: C.accent, width: 2.4 });
  P.path(ctx, P.curve(v, c.F, xLo, xHi), { color: C.blue, width: 2 });
  P.path(ctx, P.curve(v, c.df, Math.max(xLo + 0.05, xLo), xHi), { color: C.warm, width: 1.6, dash: [5, 4], alpha: 0.9 });
  P.path(ctx, P.curve(v, c.dF, xLo, xHi), { color: C.hl, width: 1.4, dash: [5, 4], alpha: 0.75 });
  P.path(ctx, [[v.X(x), v.Y(c.box[2])], [v.X(x), v.Y(c.box[3])]], { color: C.mute, width: 1, dash: [2, 3], alpha: 0.5 });
  const pf = [v.X(x), v.Y(c.f(x))], pF = [v.X(x), v.Y(c.F(x))];
  P.dot(ctx, ...pf, { r: 4.5, color: C.accent });
  P.dot(ctx, ...pF, { r: 4, color: C.blue });
  lab.set('f', 'f(x)', pf[0], pf[1], { dx: 12, dy: -10, color: C.accent });
  lab.set('F', 'F(x)', pF[0], pF[1], { dx: 12, dy: 14, color: C.blue });
  lab.set('x', 'x', v.X(x), v.Y(0), { dy: 16, color: C.soft });
  lab.end();
  return moving || cam;
});
sl.addEventListener('input', () => cv.kick());
{ let m = 0;
  for (const t of [0, 30, 55, 80, 100]) {
    sl.value = t; S.u = t / 100; formula(CASES[mode], CASES[mode].xOf(S.u));
    m = Math.max(m, fx.getBoundingClientRect().height);
  }
  fx.style.minHeight = Math.ceil(m) + 'px'; sl.value = 55; S.u = 0.55; }
cv.kick();
P.reportHeight(document.querySelector('main'));
</script></body></html>
