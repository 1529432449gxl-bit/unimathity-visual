<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Least squares as projection</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>main{max-width:900px;margin:auto}.stage canvas{height:380px}@media(max-width:520px){.stage canvas{height:310px}}</style></head>
<body><main>

<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Least squares as projection"></canvas></div>
<div class="controls"><button type="button" class="tg" id="play" aria-pressed="false">Play</button></div>
<div class="legend" id="lg"></div>
<div class="fx"><div id="eq"></div></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
import * as V from './vendor/view3d.js';
import * as T from './vendor/la3d.js';
P.style();
const { C } = P, stage = document.getElementById('stage'), canvas = document.getElementById('cv'), lab = P.labels(stage), lg = document.getElementById('lg');
const L3 = (cam, id, tex, p, color, dx = 12, dy = -10, alpha = 1) => { const q = cam.P(p); lab.set(id, tex, q[0], q[1], { dx, dy, color, alpha }) };
const a1 = [1, 0.1, 0.05], a2 = [0.2, 1, 0.1], b = [0.65, 0.5, 1.1];
const G2 = [[T.dot(a1, a1), T.dot(a1, a2)], [T.dot(a1, a2), T.dot(a2, a2)]], rhs = [T.dot(a1, b), T.dot(a2, b)];
const det = G2[0][0] * G2[1][1] - G2[0][1] ** 2, xh = [(rhs[0] * G2[1][1] - G2[0][1] * rhs[1]) / det, (G2[0][0] * rhs[1] - G2[0][1] * rhs[0]) / det];
const S = { c: [-0.35, 0.95], cT: [-0.35, 0.95], playing: false, ph: 0, grab: false };
const cam = V.camera({ az: -0.6, el: 0.34 });
const set = T.playToggle(document.getElementById('play'), S, () => cv.kick());
canvas.style.touchAction = 'none'; let rot = null;
const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top] };
canvas.addEventListener('pointerdown', e => { set(false); const [sx, sy] = pos(e), p = cam.P(T.lin([S.c[0], a1], [S.c[1], a2])); canvas.setPointerCapture(e.pointerId); if (Math.hypot(p[0] - sx, p[1] - sy) < 18) S.grab = true; else rot = [e.clientX, e.clientY, cam.az, cam.el]; cv.kick() });
canvas.addEventListener('pointermove', e => { const [sx, sy] = pos(e); if (S.grab) { const st = T.screenToPlane(cam, sx, sy, [0, 0, 0], a1, a2); if (st) S.cT = [P.clamp(st[0], -1, 1.6), P.clamp(st[1], -1, 1.6)] } else if (rot) { cam.az = rot[2] + (e.clientX - rot[0]) * .008; cam.el = P.clamp(rot[3] + (e.clientY - rot[1]) * .006, -.2, 1.3) } else return; cv.kick() });
const up = () => { S.grab = false; rot = null; cv.kick() }; canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
T.legend(lg, [['\\text{column space of }A', C.blue], ['b', C.accent], ['Ax', C.warm], ['b-Ax', C.warm, 1]]);
const F = ['\\min_x|b-Ax|', "A^{\\prime}(b-A\\hat x)=0\\iff A^{\\prime}A\\hat x=A^{\\prime}b"];
const eq = T.formulas(document.getElementById('eq'), F);
const cv = P.mount(canvas, (ctx, wd, ht, dt) => {
  cam.sc = Math.min(wd / 4.2, ht / 3.3); cam.ox = wd * 0.45; cam.oy = ht * 0.66;
  if (S.playing) { S.ph += dt * 0.6; const r = Math.max(0, Math.cos(Math.min(S.ph, Math.PI / 2))) * 1.0; const ang = S.ph * 2.2; S.cT = [xh[0] + r * 0.8 * Math.cos(ang), xh[1] + r * 0.8 * Math.sin(ang)]; if (S.ph > 4.2) S.ph = 0 }
  const mv = P.approach(S, 'c', S.cT, dt, 9);
  const p = T.lin([S.c[0], a1], [S.c[1], a2]), foot = T.lin([xh[0], a1], [xh[1], a2]), on = Math.hypot(S.c[0] - xh[0], S.c[1] - xh[1]) < 0.02;
  V.axes(ctx, cam, [1.6, 1.6, 1.4], { alpha: .3 });
  V.paint(ctx, cam, [T.plane(T.mul(.5, T.add(a1, a2)), a1, a2, C.blue, .14, 1.25)]); T.edge(ctx, cam, T.mul(.5, T.add(a1, a2)), a1, a2, { color: C.blue, s: 1.25 });
  V.line(ctx, cam, [b, foot], { color: C.soft, width: 1, dash: [2, 4], alpha: on ? 0 : .5 });
  V.line(ctx, cam, [p, b], { color: C.warm, width: on ? 2.2 : 1.6, dash: on ? null : [5, 4], alpha: .9 });
  if (on) T.rightAngle(ctx, cam, foot, T.sub(b, foot), a1);
  V.arrow(ctx, cam, [0, 0, 0], b, { color: C.accent, width: 2.6 });
  V.arrow(ctx, cam, [0, 0, 0], p, { color: C.warm, width: 2.2 });
  const q = cam.P(p); ctx.save(); ctx.beginPath(); ctx.arc(q[0], q[1], S.grab ? 7 : 5.5, 0, 7); ctx.fillStyle = C.warm; ctx.fill(); ctx.strokeStyle = C.bg; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
  L3(cam, 'b', 'b', b, C.accent, 12, -8); L3(cam, 'p', on ? 'A\\hat x' : 'Ax', p, C.warm, 14, 12); lab.end();
  eq(on ? F[1] : F[0]);
  return mv || S.playing || S.grab || !!rot;
});
cv.kick();

P.reportHeight(document.querySelector('main'));
</script></body></html>
