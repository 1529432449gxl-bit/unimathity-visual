<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二分法逐步演示</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script></head>
<body><main>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="二分法逐步缩小有根区间"></canvas></div>
<div class="fx" id="fx"></div>
<div class="nav" id="nav"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s, d) => katex.render(s, el, { throwOnError: false, displayMode: !!d });
const f = x => x ** 3 - 2 * x - 5, N = 8, WIDE = [0.75, 3.25, -9, 18];
// I[k] = 第 k 步开始时的有根区间；第 k 步取中点并保留异号的一半
const I = [[1, 3]]; for (let k = 0; k < N; k++) { const [a, b] = I[k], m = (a + b) / 2; I.push(f(a) * f(m) <= 0 ? [a, m] : [m, b]) }
function frameFor(k) {
  const [a, b] = I[Math.max(0, k - 1)], L = b - a, x0 = a - L * .18, x1 = b + L * .18;
  let y0 = 0, y1 = 0; for (let j = 0; j <= 40; j++) { const y = f(x0 + (x1 - x0) * j / 40); y0 = Math.min(y0, y); y1 = Math.max(y1, y) }
  const r = y1 - y0 || 1; return [x0, x1, y0 - r * .14, y1 + r * .14];
}
const v = P.view(WIDE, { l: 16, r: 16, t: 18, b: 30 }), fx = document.getElementById('fx'), lab = P.labels(document.getElementById('stage'));
const n6 = x => x.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
function formula(k) {
  fx.innerHTML = '<div></div><div></div>';
  K(fx.children[0], 'f(x)=x^3-2x-5,\\qquad x_k=\\tfrac{a_k+b_k}{2},\\qquad b_k-a_k=\\dfrac{b-a}{2^k}', true);
  if (k === 0) { K(fx.children[1], '[a_0,b_0]=[1,3],\\qquad f(1)<0<f(3)', true); return }
  const [a, b] = I[k - 1], m = (a + b) / 2, s = f(m) > 0 ? '>' : '<';
  K(fx.children[1], `x_{${k - 1}}=${n6(m)},\\quad f(x_{${k - 1}})${s}0\\ \\Rightarrow\\ [a_{${k}},b_{${k}}]=[${n6(I[k][0])},${n6(I[k][1])}]`, true);
}
let st; const S = { map: 0 };
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  v.w = w; v.h = h; const moving = st.tick(dt), cam = v.step(dt, 3), k = st.i, p = st.p;
  const zoom = (WIDE[1] - WIDE[0]) / (v.b[1] - v.b[0]), mapMoving = P.approach(S, 'map', zoom > 2.2 ? 1 : 0, dt, 5);
  P.axes(ctx, v, { x: true });
  P.path(ctx, P.curve(v, f), { color: C.accent, width: 2.4 });
  const ax = x => [v.X(x), v.Y(0)];
  const bracket = ([a, b], col, al, wd) => { P.path(ctx, [ax(a), ax(b)], { color: col, width: wd, alpha: al });
    for (const x of [a, b]) P.path(ctx, [[v.X(x), v.Y(0) - 7], [v.X(x), v.Y(0) + 7]], { color: col, width: 1.6, alpha: al }) };
  if (k === 0) { bracket(I[0], C.accent, 1, 4); }
  else {
    const [a, b] = I[k - 1], m = (a + b) / 2, keep = I[k], drop = keep[0] === a ? [m, b] : [a, m];
    const pv = P.ease.inOut(P.seg(p, 0, .35)), pd = P.ease.inOut(P.seg(p, .45, .8));
    bracket(keep, C.accent, 1, 4);
    bracket(drop, pd > .5 ? C.mute : C.accent, 1 - .75 * pd, 4 - 2 * pd);
    P.path(ctx, [ax(m), [v.X(m), v.Y(f(m))]], { color: C.warm, width: 1.4, dash: [3, 4], progress: pv });
    P.dot(ctx, v.X(m), v.Y(f(m)), { r: 4.5, color: C.warm, scale: P.ease.back(P.seg(p, .25, .5)) });
    P.dot(ctx, ...ax(m), { r: 4.5, color: C.warm, scale: P.ease.back(P.seg(p, .05, .3)) });
    lab.set('m', `x_{${k - 1}}`, ...ax(m), { dy: f(m) < 0 ? -16 : 18, color: C.warm });
  }
  P.minimap(ctx, v, { B: WIDE, alpha: S.map, paint: (mx, my, c) => {
    P.path(c, [[mx(WIDE[0]), my(0)], [mx(WIDE[1]), my(0)]], { color: C.rule, width: 1 });
    P.mapCurve(c, mx, my, f, WIDE[0], WIDE[1]);
    const [a, b] = I[k]; P.path(c, [[mx(a), my(0)], [mx(b), my(0)]], { color: C.accent, width: 3 }) } });
  lab.end();
  return moving || cam || mapMoving;
});
st = P.stepper(document.getElementById('nav'), { count: N + 1, dur: 1.5, hold: .6, kick: cv.kick, onChange: s => { v.aim(s.i === 0 ? WIDE : frameFor(s.i)); formula(s.i) } });
{ let m = 0; for (let i = 0; i <= N; i++) { formula(i); m = Math.max(m, fx.getBoundingClientRect().height) } fx.style.minHeight = Math.ceil(m) + 'px' }
st.go(0, false);
P.reportHeight(document.querySelector('main'));
</script></body></html>
