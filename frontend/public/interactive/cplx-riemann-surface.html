<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riemann surface</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{height:420px}@media(max-width:520px){canvas#cv{height:360px}}</style></head>
<body><main>
<div class="top" id="modes"></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="A point circling the origin moves from sheet to sheet on the Riemann surface. Drag to rotate"></canvas></div>
<div class="nav" id="nav"><button type="button" class="play" aria-pressed="true">Pause</button></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
import * as V from './vendor/view3d.js';
P.style();
const { C } = P, K = (el, s) => katex.render(s, el, { throwOnError: false });
// 对数：高度取辐角（螺旋面，取三叶）；根式：高度取 Re√z（两叶，转两圈回到原处）
const MODES = [
  { tex: '\\operatorname{Ln} z', A: [-3 * Math.PI, 3 * Math.PI], f: (r, a) => [r * Math.cos(a), r * Math.sin(a), a * .115], turns: 6 },
  { tex: '\\sqrt z', A: [0, 4 * Math.PI], f: (r, a) => [r * Math.cos(a), r * Math.sin(a), Math.sqrt(r) * Math.cos(a / 2) * .85], turns: 4 },
];
let mode = 0, ang = 0, playing = true;
const box = document.getElementById('modes');
MODES.forEach((m, i) => { const b = document.createElement('button'); b.type = 'button'; K(b, m.tex); b.setAttribute('aria-pressed', String(i === 0));
  b.onclick = () => { mode = i; ang = 0; box.querySelectorAll('button').forEach((x, j) => x.setAttribute('aria-pressed', String(j === i))); cv.kick() }; box.appendChild(b) });
const cam = V.camera({ az: -.6, el: .32 });
let drag;
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  const m = MODES[mode];
  if (playing) ang += dt * .9 / (mode ? 1 : 1.0); if (playing && !drag.active) cam.az += dt * .08;
  cam.sc = Math.min(w, h) / 3.6; cam.ox = w / 2; cam.oy = h * .5;
  const q = V.mesh((r, a) => m.f(r, a), .12, 1.25, m.A[0], m.A[1], 6, 36 * m.turns / 2);
  V.paint(ctx, cam, [{ quads: q, color: C.accent, alpha: .2, edge: .22, edgeColor: C.accent }]);
  // 底面的圆与动点
  const base = []; for (let k = 0; k <= 96; k++) { const a = 2 * Math.PI * k / 96; base.push([.8 * Math.cos(a), .8 * Math.sin(a), mode ? -1.25 : -1.5]) }
  V.line(ctx, cam, base, { color: C.mute, width: 1, alpha: .6 });
  const span = m.A[1] - m.A[0], u = ang / span, tri = mode ? u % 1 : 1 - Math.abs((u % 2) - 1), a = m.A[0] + span * (mode ? tri : .04 + .92 * tri), zb = mode ? -1.25 : -1.5, dir = mode || (u % 2) < 1 ? 1 : -1;
  const pb = [.8 * Math.cos(a), .8 * Math.sin(a), zb], ps = m.f(.8, a);
  // 曲面上已走过的轨迹（按年龄淡出）
  const trail = []; for (let k = 0; k <= 80; k++) { const b = a - dir * k * .05; if (b < m.A[0] || b > m.A[1]) break; trail.push(m.f(.8, b)) }
  V.line(ctx, cam, trail, { color: C.warm, width: 2.6 });
  V.line(ctx, cam, [pb, ps], { color: C.warm, width: 1, alpha: .6, dash: [3, 4] });
  const p1 = cam.P(pb), p2 = cam.P(ps); P.dot(ctx, p1[0], p1[1], { r: 4.5, color: C.blue }); P.dot(ctx, p2[0], p2[1], { r: 6, color: C.warm });
  return playing || drag.active;
});
drag = V.drag(document.getElementById('cv'), cam, cv.kick);
const pbn = document.querySelector('#nav .play');
const sync = () => { pbn.textContent = playing ? 'Pause' : 'Play'; pbn.setAttribute('aria-pressed', String(playing)) };
pbn.onclick = () => { playing = !playing; sync(); cv.kick() };
document.addEventListener('visibilitychange', () => { if (document.hidden) { playing = false; sync() } });
P.reportHeight(document.querySelector('main'));
</script></body></html>
