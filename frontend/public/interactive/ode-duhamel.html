<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Variation of constants</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{height:420px}@media(max-width:520px){canvas#cv{height:350px}}.fx .katex-display{margin:0}.fx>div{transition:opacity .35s}</style></head>
<body><main>
<div class="top"><button type="button" class="tg" data-m="0" aria-pressed="true">First order</button><button type="button" class="tg" data-m="1" aria-pressed="false">System</button></div>
<div class="controls"><span class="n" id="lab"></span><input id="N" type="range" min="6" max="48" step="1" value="20" aria-label="number of slices"></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="The input is cut into slices; each slice is carried forward by the homogeneous flow and the pieces add up to the solution"></canvas></div>
<div class="fx" id="fx"></div>
<div class="nav"><button type="button" id="rst" aria-label="restart">↺</button><button type="button" id="play" class="play" aria-pressed="false">Play</button></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s, d = true) => katex.render(s, el, { throwOnError: false, displayMode: d });
// 一阶：y'=P(x)y+Q(x)，P<0 且有起伏，Q 有界带起伏。切片 [s_j,s_j+Δ] 的贡献为 e^{∫_{s_j}^x P}Q(s_j)Δ，逐片叠加成解。
const P1 = x => -.55 - .3 * Math.sin(.9 * x), IP = x => -.55 * x + (.3 / .9) * (Math.cos(.9 * x) - 1);
const Q1 = x => .9 * Math.sin(1.25 * x) + .55 * Math.sin(2.7 * x + .8) + .3, X1 = 12, Y0 = 1.6;
// 方程组：x'=Ax+f(t)，A 为稳定焦点型，e^{Aτ}=e^{-aτ}R(ωτ)。
const AA = .2, OM = 1.1, T2 = 16, ETA = [1.9, .4];
const f2 = t => [.95 * Math.cos(.8 * t) + .35 * Math.sin(2.3 * t), .75 * Math.sin(1.3 * t + .4)];
const flow = (v, tau) => { const e = Math.exp(-AA * tau), c = Math.cos(OM * tau), s = Math.sin(OM * tau); return [e * (c * v[0] - s * v[1]), e * (s * v[0] + c * v[1])] };
// G(x)=∫_0^x e^{-∫P}Q：切片 [s,s+Δ] 在 x 处的贡献 = e^{∫_0^x P}(G(min(x,s+Δ))-G(s))，区间内逐渐注入，之后按齐次规律传送
const G1 = (() => { const n = 4000, h = X1 / n, g = [0]; for (let i = 0; i < n; i++) { const x = (i + .5) * h; g.push(g[i] + Math.exp(-IP(x)) * Q1(x) * h) } return { h, g } })();
const G = x => { const u = P.clamp(x / G1.h, 0, G1.g.length - 1), i = Math.floor(u), r = u - i; return i + 1 < G1.g.length ? P.lerp(G1.g[i], G1.g[i + 1], r) : G1.g[i] };
const exact1 = x => Math.exp(IP(x)) * (Y0 + G(x));
// G2(t)=∫_0^t e^{-Au}f(u)du：切片贡献 = e^{At}(G2(min(t,s+Δ))-G2(s))
const G2t = (() => { const n = 4000, h = T2 / n, g = [[0, 0]]; for (let i = 0; i < n; i++) { const u = (i + .5) * h, c = flow(f2(u), -u); g.push([g[i][0] + c[0] * h, g[i][1] + c[1] * h]) } return { h, g } })();
const G2 = t => G2t.g[P.clamp(Math.round(t / G2t.h), 0, G2t.g.length - 1)];
const ex2 = (() => { const n = 2400, h = T2 / n, out = []; let x = ETA.slice();
  const F = (t, x) => { const fv = f2(t); return [-AA * x[0] - OM * x[1] + fv[0], OM * x[0] - AA * x[1] + fv[1]] };
  for (let i = 0; i <= n; i++) { out.push(x.slice()); const t = i * h, k1 = F(t, x), k2 = F(t + h / 2, [x[0] + h / 2 * k1[0], x[1] + h / 2 * k1[1]]), k3 = F(t + h / 2, [x[0] + h / 2 * k2[0], x[1] + h / 2 * k2[1]]), k4 = F(t + h, [x[0] + h * k3[0], x[1] + h * k3[1]]);
    x = [x[0] + h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]), x[1] + h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1])] } return out })();
const B2 = (() => { let a = 0; for (const p of ex2) a = Math.max(a, Math.abs(p[0]), Math.abs(p[1])); return a * 1.12 })();
const st = { m: 0, N: 20, cur: 0, playing: false, touched: false, hold: 0, intro: 0 };
const sh = { m: 0, fade: 1 };
const fx = document.getElementById('fx');
fx.innerHTML = '<div></div><div></div>'; fx.style.display = 'grid'; fx.style.justifyItems = 'center';
K(fx.children[0], 'y=\\mathrm e^{\\int_{x_0}^{x}P(s)\\mathrm ds}\\,y_0+\\int_{x_0}^{x}\\mathrm e^{\\int_{t}^{x}P(s)\\mathrm ds}\\,Q(t)\\,\\mathrm dt');
K(fx.children[1], '\\boldsymbol x(t)=\\boldsymbol X(t)\\boldsymbol X^{-1}(t_0)\\boldsymbol\\eta+\\int_{t_0}^{t}\\boldsymbol X(t)\\boldsymbol X^{-1}(s)\\boldsymbol f(s)\\,\\mathrm ds');
for (const c of fx.children) { c.style.gridRow = '1'; c.style.gridColumn = '1' }
const formula = () => { fx.children[0].style.opacity = st.m ? 0 : 1; fx.children[1].style.opacity = st.m ? 1 : 0 };
const sl = document.getElementById('N'), nlab = document.getElementById('lab');
K(nlab, '\\Delta', false);
const lab = P.labels(document.getElementById('stage'));
const vt = P.view([-.3, X1 + .3, -1.9, 2.1], { l: 16, r: 34, t: 12, b: 6 }), vb = P.view([-.3, X1 + .3, -2.6, 3.2], { l: 16, r: 34, t: 18, b: 14 });
const vp = P.view([-1, 1, -1, 1], { l: 0, r: 0, t: 0, b: 0 });
const span = () => st.m ? T2 : X1, speed = () => st.m ? 1.05 : .95;
const cvEl = document.getElementById('cv');
const cv = P.mount(cvEl, (ctx, w, h, dt) => {
  let anim = st.intro < 1; st.intro = Math.min(1, st.intro + dt / 1.4); const I = P.ease.inOut(st.intro);
  if (st.playing) { anim = true;
    if (st.cur < span()) st.cur = Math.min(span(), st.cur + dt * speed());
    else { st.hold += dt; sh.fade = Math.max(0, 1 - Math.max(0, st.hold - 2.4) / .6); if (st.hold > 3) { st.cur = 0; st.hold = 0; sh.fade = 1 } } }
  anim = P.spring(sh, 'm', st.m, dt, { k: 40, z: .9 }) | anim;
  const N = st.N, cur = st.cur, aF = sh.fade;
  if (sh.m < .5) { // ---------- 一阶 ----------
    const D = X1 / N, Ht = Math.round(h * .3); vt.w = w; vt.h = Ht; vb.w = w; vb.h = h - Ht; const Yb = y => Ht + vb.Y(y);
    const A = (1 - sh.m * 2) * I;
    ctx.save(); ctx.globalAlpha = A;
    P.axes(ctx, vt, { x: true });
    // 输入切片：橙色柱，刚发射的更亮
    for (let j = 0; j < N; j++) { const s = j * D, q = Q1(s), fired = s <= cur, age = fired ? (cur - s) : 0;
      const a = fired ? (.16 + .4 * Math.exp(-age * 2.2)) * aF : .06;
      ctx.fillStyle = P.rgba(C.warm, a); const x0 = vt.X(s) + .6, x1 = vt.X(s + D) - .6; ctx.fillRect(x0, Math.min(vt.Y(0), vt.Y(q)), x1 - x0, Math.abs(vt.Y(q) - vt.Y(0))) }
    P.path(ctx, P.curve(vt, Q1, 0, X1), { color: C.warm, width: 2.4, progress: I });
    // 下：层层叠加
    ctx.save(); ctx.translate(0, Ht); P.axes(ctx, vb, { x: true }); ctx.restore();
    const n = Math.max(160, Math.round(w * 1.1)), xs = [], base = [];
    for (let i = 0; i <= n; i++) { const x = cur * i / n; xs.push(x); base.push(Y0 * Math.exp(IP(x))) }
    let lower = base.slice();
    // 齐次部分：灰色虚线
    P.path(ctx, xs.map((x, i) => [vb.X(x), Yb(base[i])]), { color: C.mute, width: 1.4, dash: [5, 4], alpha: aF });
    for (let j = 0; j < N; j++) { const s = j * D; if (s > cur) break;
      const gs = G(s), upper = lower.map((y, i) => xs[i] >= s ? y + Math.exp(IP(xs[i])) * (G(Math.min(xs[i], s + D)) - gs) : y);
      const i0 = Math.max(0, Math.floor(s / cur * n)), top = [], bot = [];
      for (let i = i0; i <= n; i++) { top.push([vb.X(xs[i]), Yb(upper[i])]); bot.push([vb.X(xs[i]), Yb(lower[i])]) }
      const age = Math.max(0, cur - s - D), warm = Math.exp(-age * 1.6);
      if (top.length > 1) { P.fill(ctx, top, bot, P.rgba(C.blue, (j % 2 ? .2 : .3) * aF)); if (warm > .02) P.fill(ctx, top, bot, P.rgba(C.warm, .45 * warm * aF));
        P.path(ctx, top, { color: C.bg, width: 1, alpha: .7 * aF }) }
      lower = upper }
    // 当前解（各片之和）：深蓝
    P.path(ctx, xs.map((x, i) => [vb.X(x), Yb(lower[i])]), { color: C.accent, width: 2.4, alpha: aF });
    P.path(ctx, [[vt.X(cur), vt.Y(2)], [vb.X(cur), Yb(vb.b[2])]], { color: C.mute, width: 1, dash: [2, 4], alpha: .6 * aF });
    P.dot(ctx, vb.X(cur), Yb(lower[n]), { r: 4.5, color: C.accent, alpha: aF });
    ctx.restore();
    lab.set('Q', 'Q(x)', vt.X(X1) + 18, vt.Y(Q1(X1)), { color: C.warm, alpha: A });
    lab.set('y', 'y(x)', vb.X(X1) + 18, Yb(exact1(X1)), { color: C.accent, alpha: A });
    lab.set('y0', 'y_0', vb.X(0) - 4, Yb(Y0) - 14, { color: C.mute, size: 13, alpha: A });
  } else lab.set('Q', 'Q(x)', 0, 0, { alpha: 0 });
  if (sh.m > .5) { // ---------- 方程组 ----------
    const A = (sh.m * 2 - 1) * I, D = T2 / N;
    const s = Math.min(w, h) / (2 * B2); vp.w = w; vp.h = h; vp.b = [-w / 2 / s, w / 2 / s, -h / 2 / s, h / 2 / s];
    const X = vp.X, Y = vp.Y;
    ctx.save(); ctx.globalAlpha = A;
    P.axes(ctx, vp, { x: true, y: true });
    // 解的轨迹（切片求和）：深蓝
    const state = t => { const g = G2(t), h0 = flow(ETA, t), c = flow(g, t); return [h0[0] + c[0], h0[1] + c[1]] };
    const tr = []; const n = Math.max(80, Math.round(cur * 40)); for (let i = 0; i <= n; i++) { const p = state(cur * i / n); tr.push([X(p[0]), Y(p[1])]) }
    P.path(ctx, tr, { color: C.accent, width: 2.4, alpha: aF });
    // 当前时刻的箭头链：齐次部分（灰）→ 各切片被流传送后的向量（浅蓝，最新为橙）
    const arrow = (a, b, col, wd, al) => { const ax = X(a[0]), ay = Y(a[1]), bx = X(b[0]), by = Y(b[1]), L = Math.hypot(bx - ax, by - ay); if (L < 1.5) return;
      P.path(ctx, [[ax, ay], [bx, by]], { color: col, width: wd, alpha: al }); if (L < 7) return; const g = Math.atan2(by - ay, bx - ax), hl = Math.min(7, L * .4);
      P.path(ctx, [[bx - hl * Math.cos(g - .45), by - hl * Math.sin(g - .45)], [bx, by], [bx - hl * Math.cos(g + .45), by - hl * Math.sin(g + .45)]], { color: col, width: wd, alpha: al }) };
    let p0 = [0, 0], p1 = flow(ETA, cur); arrow(p0, p1, C.mute, 1.6, .9 * aF); p0 = p1;
    for (let j = 0; j < N; j++) { const sj = j * D; if (sj > cur) break; const g0 = G2(sj), g1 = G2(Math.min(cur, sj + D)), c = flow([g1[0] - g0[0], g1[1] - g0[1]], cur), nx = [p0[0] + c[0], p0[1] + c[1]], warm = Math.exp(-Math.max(0, cur - sj - D) * 1.5);
      arrow(p0, nx, warm > .3 ? C.warm : C.blue, 1.6, (.55 + .45 * warm) * aF); p0 = nx }
    P.dot(ctx, X(p0[0]), Y(p0[1]), { r: 5, color: C.accent, alpha: aF });
    P.dot(ctx, X(ETA[0]), Y(ETA[1]), { r: 3.5, color: C.mute, alpha: .8 });
    ctx.restore();
    lab.set('eta', '\\boldsymbol\\eta', X(ETA[0]) + 12, Y(ETA[1]) - 12, { color: C.mute, size: 13, alpha: A });
    lab.set('y', 'y(x)', 0, 0, { alpha: 0 }); lab.set('y0', 'y_0', 0, 0, { alpha: 0 });
  } else lab.set('eta', '\\eta', 0, 0, { alpha: 0 });
  lab.end();
  return anim;
});
const playBtn = document.getElementById('play');
function stop() { st.playing = false; playBtn.textContent = 'Play'; playBtn.setAttribute('aria-pressed', 'false') }
function play() { if (st.cur >= span()) { st.cur = 0; st.hold = 0; sh.fade = 1 } st.playing = true; playBtn.textContent = 'Pause'; playBtn.setAttribute('aria-pressed', 'true'); cv.kick() }
playBtn.onclick = () => { st.touched = true; st.playing ? stop() : play() };
const restart = () => { st.cur = 0; st.hold = 0; sh.fade = 1; play() };
document.getElementById('rst').onclick = () => { st.touched = true; restart() };
sl.addEventListener('input', () => { st.touched = true; st.N = +sl.value; restart() });
const setM = m => { st.m = m; document.querySelectorAll('.tg').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.m === m))); formula(); st.N = +sl.value; st.cur = 0; st.hold = 0; sh.fade = 1; cv.kick() };
document.querySelectorAll('.tg').forEach(b => b.onclick = () => { st.touched = true; setM(+b.dataset.m); play() });
document.addEventListener('visibilitychange', () => { if (document.hidden) stop() });
new IntersectionObserver(es => { if (es[0].isIntersecting) { if (!st.touched && !st.playing) setTimeout(() => { if (!st.touched && !st.playing) play() }, 900) } else stop() }, { threshold: .4 }).observe(cvEl);
if (new URLSearchParams(location.search).get('mode') === 'system') { setM(1); sh.m = 1 }
formula();
P.reportHeight(document.querySelector('main'));
</script></body></html>
