<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grid under a conformal map</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{height:380px}@media(max-width:520px){canvas#cv{height:340px}}</style></head>
<body><main>
<div class="top" id="modes"></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="A square grid deforms under an analytic map while right angles are preserved"></canvas></div>
<div class="nav" id="nav"><button type="button" class="play" aria-pressed="true">Pause</button></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s) => katex.render(s, el, { throwOnError: false });
const ex = z => { const e = Math.exp(z[0]); return [e * Math.cos(z[1]), e * Math.sin(z[1])] };
const MAPS = [
  { tex: 'w=z^2', f: z => [z[0] * z[0] - z[1] * z[1], 2 * z[0] * z[1]], R: [.25, 1.45, .1, 1.3], mark: [.95, .55] },
  { tex: 'w=e^z', f: ex, R: [-1.1, .55, -1.5, 1.5], mark: [0, .7] },
  { tex: 'w=\\sin z', f: z => [Math.sin(z[0]) * Math.cosh(z[1]), Math.cos(z[0]) * Math.sinh(z[1])], R: [-1.35, 1.35, .15, 1.05], mark: [.6, .6] },
];
let mode = 0, clock = 0, playing = true;
const box = document.getElementById('modes');
MAPS.forEach((m, i) => { const b = document.createElement('button'); b.type = 'button'; K(b, m.tex); b.setAttribute('aria-pressed', String(i === 0));
  b.onclick = () => { mode = i; clock = 0; box.querySelectorAll('button').forEach((x, j) => x.setAttribute('aria-pressed', String(j === i))); cv.kick() }; box.appendChild(b) });
const NL = 9, NS = 90;
const st = { box: null };
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  if (playing) clock += dt;
  const T = 9, ph = clock % T, t = ph < 1 ? 0 : ph < 4 ? P.ease.inOut((ph - 1) / 3) : ph < 6 ? 1 : ph < 8.5 ? 1 - P.ease.inOut((ph - 6) / 2.5) : 0;
  const m = MAPS[mode], [x0, x1, y0, y1] = m.R, F = z => { const q = m.f(z); return [(1 - t) * z[0] + t * q[0], (1 - t) * z[1] + t * q[1]] };
  // 视窗：原网格与像网格的并
  let b = [Infinity, -Infinity, Infinity, -Infinity];
  for (let i = 0; i <= 12; i++) for (let j = 0; j <= 12; j++) { const z = [x0 + (x1 - x0) * i / 12, y0 + (y1 - y0) * j / 12]; for (const q of [F(z)]) { b = [Math.min(b[0], q[0]), Math.max(b[1], q[0]), Math.min(b[2], q[1]), Math.max(b[3], q[1])] } }
  b = [Math.min(b[0], -.2), Math.max(b[1], .2), Math.min(b[2], -.2), Math.max(b[3], .2)];
  const mb = P.approach(st, 'box', b, dt, 3.2); b = st.box;
  const s = Math.min((w - 40) / (b[1] - b[0]), (h - 30) / (b[3] - b[2])), cx = (b[0] + b[1]) / 2, cy = (b[2] + b[3]) / 2, S = q => [w / 2 + (q[0] - cx) * s, h / 2 - (q[1] - cy) * s];
  P.path(ctx, [S([b[0] - 1, 0]), S([b[1] + 1, 0])], { color: C.rule, width: 1 }); P.path(ctx, [S([0, b[2] - 1]), S([0, b[3] + 1])], { color: C.rule, width: 1 });
  for (let i = 0; i <= NL; i++) {
    const x = x0 + (x1 - x0) * i / NL, y = y0 + (y1 - y0) * i / NL, v1 = [], v2 = [];
    for (let k = 0; k <= NS; k++) { v1.push(S(F([x, y0 + (y1 - y0) * k / NS]))); v2.push(S(F([x0 + (x1 - x0) * k / NS, y]))) }
    P.path(ctx, v1, { color: C.accent, width: i % 3 ? 1.2 : 1.9, alpha: i % 3 ? .55 : .95 }); P.path(ctx, v2, { color: C.blue, width: i % 3 ? 1.2 : 1.9, alpha: i % 3 ? .55 : .95 });
  }
  // 一个网格交点处的两条切向，始终正交
  const z0 = m.mark, e = 1e-4, p0 = F(z0), px = F([z0[0] + e, z0[1]]), py = F([z0[0], z0[1] + e]);
  const ux = [px[0] - p0[0], px[1] - p0[1]], uy = [py[0] - p0[0], py[1] - p0[1]], L = 22 / s, n1 = Math.hypot(...ux), n2 = Math.hypot(...uy);
  const A = S(p0), B1 = S([p0[0] + ux[0] / n1 * L, p0[1] + ux[1] / n1 * L]), B2 = S([p0[0] + uy[0] / n2 * L, p0[1] + uy[1] / n2 * L]);
  P.path(ctx, [A, B1], { color: C.warm, width: 2.4 }); P.path(ctx, [A, B2], { color: C.warm, width: 2.4 });
  const k = .38, c1 = [A[0] + (B1[0] - A[0]) * k, A[1] + (B1[1] - A[1]) * k], c2 = [A[0] + (B2[0] - A[0]) * k, A[1] + (B2[1] - A[1]) * k];
  P.path(ctx, [c1, [c1[0] + c2[0] - A[0], c1[1] + c2[1] - A[1]], c2], { color: C.warm, width: 1.2 });
  P.dot(ctx, ...A, { r: 4, color: C.warm });
  return playing || mb;
});
const pb = document.querySelector('#nav .play');
const sync = () => { pb.textContent = playing ? 'Pause' : 'Play'; pb.setAttribute('aria-pressed', String(playing)) };
pb.onclick = () => { playing = !playing; sync(); cv.kick() };
document.addEventListener('visibilitychange', () => { if (document.hidden) { playing = false; sync() } });
P.reportHeight(document.querySelector('main'));
</script></body></html>
