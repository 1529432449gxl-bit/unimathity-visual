<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Second derivative test</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>main{max-width:900px;margin:auto}.stage canvas{height:380px}.fx{justify-content:center}@media(max-width:520px){.stage canvas{height:320px}}</style></head>
<body><main>
<div class="top" id="mode"><button type="button" data-m="bowl" aria-pressed="false"></button><button type="button" data-m="saddle" aria-pressed="true"></button></div>
<div class="controls"><span class="n" id="lab"></span><input id="a" type="range" min="0" max="1000" step="1" value="0" aria-label="direction"><button type="button" class="tg" id="play" aria-pressed="false">Play</button></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Second derivative test"></canvas></div>
<div class="legend" id="legend"></div>
<div class="fx" id="fx"><div id="eq"></div></div>

</main>
<script type="module">
import * as P from './vendor/plotfx.js';
import * as V from './vendor/view3d.js';
P.style();
const { C } = P, K = (el, s, d) => katex.render(s, el, { throwOnError: false, displayMode: !!d });
const stage = document.getElementById('stage'), canvas = document.getElementById('cv'), lab = P.labels(stage), eqEl = document.getElementById('eq'), fxEl = document.getElementById('fx');
const legend = items => { document.getElementById('legend').innerHTML = ''; for (const [t, c, d] of items) { const e = document.createElement('span'); e.className = 'key' + (d ? ' dash' : ''); e.style.setProperty('--c', c); K(e, t); document.getElementById('legend').append(e) } };
const lockEq = list => { let m = 0; for (const t of list) { K(eqEl, t, 1); m = Math.max(m, fxEl.getBoundingClientRect().height) } fxEl.style.minHeight = Math.ceil(m) + 'px'; };
const playBtn = (btn, S, kick) => { const set = on => { S.playing = on; btn.textContent = on ? 'Pause' : 'Play'; btn.setAttribute('aria-pressed', String(on)); if (on) { try { kick() } catch (e) {} } }; document.addEventListener('visibilitychange', () => { if (document.hidden) set(false) }); return set; };

const Q = { bowl: { t: 'AC-B^2>0', f: (x, y) => 0.45 * x * x + 0.15 * x * y + 0.3 * y * y }, saddle: { t: 'AC-B^2<0', f: (x, y) => 0.45 * x * x + 0.1 * x * y - 0.35 * y * y } };
const btns = [...document.querySelectorAll('#mode button')]; btns.forEach(b => K(b, Q[b.dataset.m].t));
legend([['z=f(x,y)', C.accent], ['\\text{section bending up}', C.warm], ['\\text{section bending down}', C.blue]]);
K(eqEl, 'f(x_0+h,y_0+k)-f(x_0,y_0)\\approx\\tfrac12\\left(Ah^2+2Bhk+Ck^2\\right)', 1);
const sl = document.getElementById('a'), btn = document.getElementById('play');
const S = { m: 'saddle', a: 0, target: 0, playing: true };
const set = playBtn(btn, S, () => cv.kick()); set(true); btn.onclick = () => set(!S.playing);
const cam = V.camera({ az: -0.6, el: 0.42 }); const dr = V.drag(canvas, cam, () => cv.kick(), { onStart: () => set(false) });
let quads; const build = () => { quads = V.mesh((r, t) => { const x = r * Math.cos(t), y = r * Math.sin(t); return [x, y, Q[S.m].f(x, y)] }, 0.001, 1.4, 0, 2 * Math.PI, 12, 40) }; build();
btns.forEach(b => b.addEventListener('click', () => { S.m = b.dataset.m; btns.forEach(o => o.setAttribute('aria-pressed', String(o === b))); build(); cv.kick() }));
const cv = P.mount(canvas, (ctx, w, h, dt) => {
  cam.sc = Math.min(w / 3.8, h / 3.0); cam.ox = w / 2; cam.oy = h * 0.55;
  if (S.playing) { S.target += 0.5 * dt; sl.value = (S.target % Math.PI) / Math.PI * 1000 }
  const mv = P.approach(S, 'a', S.target, dt, 9), a = S.a, e = [Math.cos(a), Math.sin(a)], f = Q[S.m].f;
  const q2 = f(e[0], e[1]), col = q2 >= 0 ? C.warm : C.blue;      // 沿方向 e 的二阶项符号
  K(document.getElementById('lab'), `\\theta=${((a % Math.PI)).toFixed(2)}`);
  const pl = V.poly([[-1.5 * e[0], -1.5 * e[1], -0.9], [1.5 * e[0], 1.5 * e[1], -0.9], [1.5 * e[0], 1.5 * e[1], 1.0], [-1.5 * e[0], -1.5 * e[1], 1.0]], col, .1);
  V.paint(ctx, cam, [{ quads, color: C.accent, alpha: .22, edge: .1 }, pl]);
  const sec = []; for (let i = 0; i <= 60; i++) { const r = -1.4 + 2.8 * i / 60; sec.push([r * e[0], r * e[1], f(r * e[0], r * e[1])]) }
  V.line(ctx, cam, sec, { color: col, width: 2.8 });
  const o = cam.P([0, 0, 0]); P.dot(ctx, o[0], o[1], { r: 4.6, color: C.accent });
  lab.set('P', 'P_0', o[0], o[1], { dx: -16, dy: 10, color: C.accent, size: 13 }); lab.end();
  return mv || S.playing || dr.active;
});
sl.addEventListener('input', () => { set(false); S.target = +sl.value / 1000 * Math.PI; S.a = S.a % Math.PI; cv.kick() });
cv.kick();

P.reportHeight(document.querySelector('main'));
</script></body></html>
