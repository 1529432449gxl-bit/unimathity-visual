<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幂法的方向迭代</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script></head>
<body><main>
<div class="controls"><span class="n" id="lab"></span><input id="th" type="range" min="-30" max="30" step="1" value="0" aria-label="初始方向角"></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="幂法：向量方向逐步转向主特征方向"></canvas></div>
<div class="fx" id="fx"></div>
<div class="nav" id="nav"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s, d) => katex.render(s, el, { throwOnError: false, displayMode: !!d });
const R2 = Math.SQRT1_2, V1 = [R2, R2], ROUNDS = 7, WIDE = { c: [1, 1], r: 2.35 };
const sl = document.getElementById('th'), fx = document.getElementById('fx');
let steps = [];
function build() {
  const t = +sl.value * Math.PI / 180; let x = [Math.cos(t), Math.sin(t)]; steps = [{ k: 0, phase: 'init', vec: x, prev: x, hist: [] }]; const hist = [];
  for (let k = 0; k < ROUNDS; k++) {
    const y = [2 * x[0] + x[1], x[0] + 2 * x[1]], n = Math.hypot(...y), nx = [y[0] / n, y[1] / n];
    steps.push({ k, phase: 'mul', vec: y, prev: x, hist: hist.slice() }); hist.push(x);
    steps.push({ k: k + 1, phase: 'norm', vec: nx, prev: x, hist: hist.slice(), y }); x = nx;
  }
}
const ang = u => Math.abs(Math.atan2(u[0] * V1[1] - u[1] * V1[0], u[0] * V1[0] + u[1] * V1[1])) * 180 / Math.PI;
const unit = u => { const n = Math.hypot(...u); return [u[0] / n, u[1] / n] };
// 镜头：围绕单位圆上的主特征方向点，半径随当前方向与它的距离缩小
function camFor(i) {
  const s = steps[i]; if (i < 2) return WIDE;
  const d = Math.max(Math.hypot(unit(s.vec)[0] - R2, unit(s.vec)[1] - R2), Math.hypot(s.prev[0] - R2, s.prev[1] - R2));
  const r = Math.min(WIDE.r, Math.max(.035, d * 1.9)), t = P.clamp((r - .035) / (WIDE.r - .035), 0, 1);
  return { c: [P.lerp(R2, 1, t), P.lerp(R2, 1, t)], r };
}
const cam = { c: WIDE.c.slice(), r: WIDE.r }, tgt = { c: WIDE.c.slice(), r: WIDE.r }, v = P.view([0, 1, 0, 1], { l: 10, r: 10, t: 10, b: 10 });
const lab = P.labels(document.getElementById('stage'));
function arrow(ctx, a, b, color, width, alpha = 1) {
  P.path(ctx, [a, b], { color, width, alpha }); const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), L = 9 + width;
  ctx.save(); ctx.globalAlpha = alpha; ctx.beginPath(); ctx.moveTo(b[0], b[1]); ctx.lineTo(b[0] - L * Math.cos(ang - .38), b[1] - L * Math.sin(ang - .38)); ctx.lineTo(b[0] - L * Math.cos(ang + .38), b[1] - L * Math.sin(ang + .38)); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
const n6 = x => Number(x.toFixed(6)).toString();
function formula(i) {
  const s = steps[i]; fx.innerHTML = '<div></div><div></div>';
  K(fx.children[0], s.phase === 'init' ? 'A=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix},\\qquad v_1=\\tfrac{1}{\\sqrt2}(1,1)^T' : s.phase === 'mul' ? `y_{${s.k}}=Ax_{${s.k}}` : `x_{${s.k}}=\\dfrac{y_{${s.k - 1}}}{\\|y_{${s.k - 1}}\\|_2}`, true);
  const lb = s.phase === 'mul' ? `y_{${s.k}}` : `x_{${s.k}}`;
  K(fx.children[1], `\\|${lb}\\|_2\\approx${n6(Math.hypot(...s.vec))},\\qquad\\angle(${lb},v_1)\\approx${n6(ang(s.vec))}^\\circ`, true);
}
let st; const S = { map: 0 };
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  v.w = w; v.h = h; const moving = st.tick(dt);
  const m1 = P.approach(cam, 'c', tgt.c, dt, 3), m2 = P.approach(cam, 'r', tgt.r, dt, 3), asp = (w - 20) / (h - 20);
  v.b = [cam.c[0] - cam.r * asp, cam.c[0] + cam.r * asp, cam.c[1] - cam.r, cam.c[1] + cam.r];
  const S2 = u => [v.X(u[0]), v.Y(u[1])], O = S2([0, 0]), s = steps[st.i], p = st.p, zoomed = cam.r < WIDE.r / 2.5;
  const mapMoving = P.approach(S, 'map', zoomed ? 1 : 0, dt, 5);
  P.axes(ctx, v, { x: true, y: true });
  const circ = Array.from({ length: 721 }, (_, k) => S2([Math.cos(k * Math.PI / 360), Math.sin(k * Math.PI / 360)]));
  P.path(ctx, circ, { color: C.rule, width: 1.2 });
  P.path(ctx, [S2([-1.5, -1.5]), S2([4, 4])], { color: C.mute, width: 1.4, alpha: .8 });
  s.hist.forEach((u, k) => P.path(ctx, [O, S2(u)], { color: C.mute, width: 1, alpha: .15 + .25 * k / Math.max(1, s.hist.length) }));
  const pe = P.ease.inOut(P.seg(p, 0, .8));
  if (s.phase !== 'init') { arrow(ctx, O, S2(s.prev), C.blue, 1.8); lab.set('prev', `x_{${s.phase === 'mul' ? s.k : s.k - 1}}`, ...S2(s.prev), { dx: -14, dy: -12, color: C.blue, alpha: zoomed ? 0 : 1 }) } else lab.set('prev', '', 0, 0, { alpha: 0 });
  // 当前向量：乘矩阵时从旧向量伸长转向，规范化时从 y 缩回单位圆
  const from = s.phase === 'mul' ? s.prev : s.phase === 'norm' ? s.y : s.vec, cur = [P.lerp(from[0], s.vec[0], pe), P.lerp(from[1], s.vec[1], pe)];
  arrow(ctx, O, S2(cur), C.warm, 2.6);
  if (s.phase !== 'init') P.dot(ctx, ...S2(unit(cur)), { r: 3.2, color: C.warm, alpha: .9 });
  lab.set('cur', s.phase === 'mul' ? `y_{${s.k}}` : `x_{${s.k}}`, ...S2(cur), { dx: 14, dy: 12, color: C.warm, alpha: zoomed ? 0 : 1 });
  lab.set('v1', 'v_1', ...S2(zoomed ? [cam.c[0] + cam.r * .55, cam.c[1] + cam.r * .55] : [2.9, 2.9]), { dx: 12, color: C.mute });
  P.minimap(ctx, v, { B: [-1.4, 3.4, -1.4, 3.4], alpha: S.map, aspect: 1, frac: .24, paint: (mx, my, c) => {
    const M = u => [mx(u[0]), my(u[1])]; P.path(c, Array.from({ length: 121 }, (_, k) => M([Math.cos(k * Math.PI / 60), Math.sin(k * Math.PI / 60)])), { color: C.rule, width: 1 });
    P.path(c, [M([-1.3, -1.3]), M([3.3, 3.3])], { color: C.mute, width: 1 }); P.path(c, [M([0, 0]), M(cur)], { color: C.warm, width: 1.4 }) } });
  lab.end();
  return moving || m1 || m2 || mapMoving;
});
st = P.stepper(document.getElementById('nav'), { count: 2 * ROUNDS + 1, dur: 1.4, hold: .5, kick: cv.kick, onChange: s => { const t = camFor(s.i); tgt.c = t.c.slice(); tgt.r = t.r; formula(s.i) } });
function reset(snap) { build(); K(document.getElementById('lab'), `\\theta_0=${sl.value}^\\circ`); st.stop(); st.go(0, false); if (snap) { cam.c = WIDE.c.slice(); cam.r = WIDE.r } }
sl.addEventListener('input', () => reset(false)); reset(true);
{ let m = 0; for (let i = 0; i < steps.length; i++) { formula(i); m = Math.max(m, fx.getBoundingClientRect().height) } fx.style.minHeight = Math.ceil(m) + 'px'; formula(0) }
P.reportHeight(document.querySelector('main'));
window.visualAudit = { steps: () => steps };
</script></body></html>
