<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cramer n</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script><script src="vendor/steady.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbfbfa;color:#161820;font:14px/1.6 "Microsoft YaHei",sans-serif}
main{padding:10px 2px 6px}
.mats{display:flex;flex-wrap:wrap;gap:18px 26px;justify-content:center;align-items:flex-start;min-height:210px}
.mat{display:flex;flex-direction:column;align-items:center;gap:4px}
.mat .lab{font-size:15px;min-height:26px}
.grid{display:grid;gap:3px;padding:4px 6px;position:relative}
.grid:before,.grid:after{content:"";position:absolute;top:0;bottom:0;width:7px;border:1.6px solid #4f525b}
.grid:before{left:0;border-right:0}.grid:after{right:0;border-left:0}
.cell{width:46px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:14px;transition:background .25s,box-shadow .25s,color .25s}
.cell.sep{margin-left:10px;position:relative}.cell.sep:before{content:"";position:absolute;left:-8px;top:2px;bottom:2px;border-left:1.4px dashed #9a9da5}
.cell.e{color:#c9cbd1}.cell.z{color:#b3b5bc}
.cell.s{box-shadow:inset 0 0 0 2px #223056;background:#eeeff4}
.cell.t{background:#f3e3d2;box-shadow:inset 0 0 0 2px #b5763a;color:#161820;font-weight:600}
.cell.p{background:#eeeff4}
.cell.d{color:#c9cbd1;background:#f4f4f2}
.grid.det:before,.grid.det:after{width:0;border:0;border-left:1.6px solid #4f525b}
.fx{margin:14px auto 0;max-width:760px;min-height:96px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:16px}
.fx .katex-display{margin:0}.fx .l{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:3px 4px}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.nav button{width:44px;height:36px;border:1px solid #223056;border-radius:6px;background:transparent;color:#223056;font-size:18px;cursor:pointer;line-height:1}
.nav button:disabled{opacity:.3;cursor:default}.nav button.play{width:auto;padding:0 14px;font-size:14px}.nav button.play[aria-pressed="true"]{background:#223056;color:#fff}
.nav .ct{min-width:64px;text-align:center;color:#4f525b;font-variant-numeric:tabular-nums}
button:focus-visible{outline:2px solid #223056;outline-offset:2px}
@media(max-width:480px){.cell{width:38px;height:32px;font-size:12px}.mats{gap:12px 14px}.fx{font-size:14px}}
</style></head>
<body><main>
<div class="mats" id="mats"></div>
<div class="fx" id="fx"></div>
<div class="nav"><button id="first" type="button" aria-label="回到开始">↺</button><button id="prev" type="button" aria-label="上一步">◀</button><span class="ct" id="ct"></span><button id="next" type="button" aria-label="下一步">▶</button><button id="play" class="play" type="button" aria-pressed="false">Play</button></div>
</main>
<script>
const R=['1','2','3','\\vdots','n'], C=['1','2','3','\\cdots','n'];
const num=x=>x==='n'?1e9:(x==='\\vdots'||x==='\\cdots')?1e8:+x;
function cell(r,c,s){
  const rn=num(r),cn=num(c);
  if(r==='\\vdots'&&c==='\\cdots')return '\\ddots';
  if(cn<rn&&cn<=s&&cn<1e8)return '0';
  if(r==='\\vdots')return '\\vdots';
  if(c==='\\cdots')return '\\cdots';
  let sup=Math.min(rn-1,s); let st=sup>=1e8?'n-1':String(sup);
  if(r==='n'&&s>=99)st='n-1';
  return st==='0'?'a_{'+r+c+'}':'a^{('+st+')}_{'+r+c+'}';
}
const mat=(s,lbl)=>({key:'D',label:lbl,aug:-1,cells:R.map(r=>C.map(c=>cell(r,c,s)))});
const steps=[];
steps.push({mats:[mat(0,'|A|')],hi:[],lines:['|A|']});
for(const k of [1,2]){
  const s=k-1, kk=String(k);
  const piv=s===0?'a_{11}':'a^{(1)}_{22}';
  const sub=s===0?'a_{i1}':'a^{(1)}_{i2}';
  steps.push({mats:[mat(s,'|A|')],hi:[['D',k-1,k-1,'s'],...R.map((r,i)=>i>=k?['D',i,k-1,'t']:null).filter(Boolean)],lines:['r_i-\\dfrac{'+sub+'}{'+piv+'}\\,r_'+kk+'\\quad(i='+(k+1)+',\\cdots,n)']});
  steps.push({mats:[mat(k,'|A|')],hi:R.map((r,i)=>i>=k?['D',i,k-1,'p']:null).filter(Boolean),lines:['|A|\\ \\text{unchanged}']});
}
steps.push({mats:[mat(99,'|A|')],hi:R.map((r,i)=>['D',i,i,'s']).filter(x=>!(R[x[1]]==='\\vdots')),lines:['|A|=a_{11}\\,a^{(1)}_{22}\\,a^{(2)}_{33}\\cdots a^{(n-1)}_{nn}']});
const matsEl=document.getElementById('mats'),fx=document.getElementById('fx'),ct=document.getElementById('ct');let cur=0;
const K=(el,s,disp)=>katex.render(s,el,{throwOnError:false,displayMode:!!disp});
function render(){const st=steps[cur];matsEl.innerHTML='';
 const hmap={};st.hi.forEach(([k,i,j,c])=>{hmap[k+','+i+','+j]=c});
 st.mats.forEach(m=>{const box=document.createElement('div');box.className='mat';const lab=document.createElement('div');lab.className='lab';K(lab,m.label);
  const g=document.createElement('div');g.className='grid'+(m.key==='D'?' det':'');g.style.gridTemplateColumns=`repeat(${m.cells[0].length},auto)`;
  m.cells.forEach((r,i)=>r.forEach((s,j)=>{const d=document.createElement('div');let cls='cell';if(j===m.aug)cls+=' sep';
   if(/dots/.test(s))cls+=' z';K(d,s);const h=hmap[m.key+','+i+','+j];if(h)cls+=' '+h;d.className=cls;g.appendChild(d)}));
  box.append(lab,g);matsEl.appendChild(box)});
 fx.innerHTML='';st.lines.forEach(s=>{const d=document.createElement('div');d.className='l';K(d,s,true);fx.appendChild(d)});
 ct.textContent=`${cur} / ${steps.length-1}`;document.getElementById('prev').disabled=cur===0;document.getElementById('first').disabled=cur===0;document.getElementById('next').disabled=cur===steps.length-1}
const go=v=>{cur=Math.max(0,Math.min(steps.length-1,v));render()};
let timer=null;const playBtn=document.getElementById('play');
function stopPlay(){clearInterval(timer);timer=null;playBtn.textContent='Play';playBtn.setAttribute('aria-pressed','false')}
playBtn.onclick=()=>{if(timer){stopPlay();return}if(cur>=steps.length-1)go(0);playBtn.textContent='Pause';playBtn.setAttribute('aria-pressed','true');timer=setInterval(()=>{if(cur>=steps.length-1){stopPlay();return}go(cur+1);if(cur>=steps.length-1)stopPlay()},1400)};
document.getElementById('next').onclick=()=>{stopPlay();go(cur+1)};document.getElementById('prev').onclick=()=>{stopPlay();go(cur-1)};document.getElementById('first').onclick=()=>{stopPlay();go(0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPlay()});
addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stopPlay();go(cur+1)}if(e.key==='ArrowLeft'){stopPlay();go(cur-1)}});
new ResizeObserver(()=>{parent.postMessage({type:'runge-height',height:Math.ceil(document.querySelector('main').getBoundingClientRect().height)},location.origin)}).observe(document.querySelector('main'));
render();window.msteps={n:()=>steps.length,go,last:()=>steps[steps.length-1]};
if(window.Steady){Steady.sweep([fx,matsEl],steps.length,i=>{cur=i;render()},()=>{cur=0;render()});Steady.hold(fx,matsEl);}
</script></body></html>
