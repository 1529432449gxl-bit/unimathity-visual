<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upper semicircle contour</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{height:360px}@media(max-width:520px){canvas#cv{height:300px}}</style></head>
<body><main>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="The semicircular contour grows, its arc fades, and poles in the upper half-plane are enclosed one by one"></canvas></div>
<div class="nav" id="nav"><button type="button" data-a="first" aria-label="Restart">↺</button><button type="button" class="play" aria-pressed="true">Pause</button></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P;
const POLES = [[.7, .8], [-1.3, 1.5], [.4, 2.6], [-.6, -1.1], [1.6, -.7]];
const R0 = .45, R1 = 3.4, DUR = 7;
let t = 0, playing = true, hold = 0;
const lab = P.labels(document.getElementById('stage'));
function arrowAt(ctx, pts, k, color, alpha) { if (k < 1 || k >= pts.length) return; const [a, b] = [pts[k - 1], pts[k]], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, hh = 8;
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(b[0] + ux * 4, b[1] + uy * 4); ctx.lineTo(b[0] - ux * hh - uy * hh * .45, b[1] - uy * hh + ux * hh * .45); ctx.lineTo(b[0] - ux * hh + uy * hh * .45, b[1] - uy * hh - ux * hh * .45); ctx.closePath(); ctx.fill(); ctx.restore() }
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  if (playing) { if (t < 1) t = Math.min(1, t + dt / DUR); else { hold += dt; if (hold > 1.8) { hold = 0; t = 0 } } }
  const R = R0 + (R1 - R0) * P.ease.inOut(t);
  const s = Math.min(w / 7.6, h / 4.9), ox = w / 2, oy = h * .72, S = ([x, y]) => [ox + x * s, oy - y * s];
  P.path(ctx, [S([-3.7, 0]), S([3.7, 0])], { color: C.rule, width: 1 }); P.path(ctx, [S([0, -1.4]), S([0, 3.6])], { color: C.rule, width: 1 });
  const fadeArc = P.clamp(1.25 - (R - R0) / (R1 - R0) * 1.05, .14, 1);
  const seg = [S([-R, 0]), S([R, 0])], arc = [];
  for (let k = 0; k <= 120; k++) { const a = Math.PI * k / 120; arc.push(S([R * Math.cos(a), R * Math.sin(a)])) }
  ctx.save(); ctx.beginPath(); arc.forEach((p, k) => k ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath(); ctx.fillStyle = P.rgba(C.blue, .07); ctx.fill(); ctx.restore();
  P.path(ctx, seg, { color: C.accent, width: 2.6 });
  P.path(ctx, arc, { color: C.blue, width: 2.2, alpha: fadeArc });
  const mid = [S([-R * .15, 0]), S([R * .15, 0])]; arrowAt(ctx, mid, 1, C.accent, 1);
  arrowAt(ctx, arc, 40, C.blue, fadeArc); arrowAt(ctx, arc, 82, C.blue, fadeArc);
  for (const p of POLES) {
    const inside = p[1] > 0 && Math.hypot(...p) < R, q = S(p);
    ctx.save(); ctx.beginPath(); ctx.arc(q[0], q[1], inside ? 6 : 5, 0, 7);
    if (inside) { ctx.fillStyle = C.warm; ctx.fill() } else { ctx.fillStyle = C.bg; ctx.fill(); ctx.strokeStyle = C.mute; ctx.lineWidth = 1.6; ctx.stroke() }
    ctx.restore();
  }
  lab.set('R', 'R', ...S([R, 0]), { color: C.soft, dy: 14, size: 13 });
  lab.set('mR', '-R', ...S([-R, 0]), { color: C.soft, dy: 14, size: 13 });
  lab.set('CR', 'C_R', ...S([R * Math.cos(.8), R * Math.sin(.8)]), { color: C.blue, dx: 14, dy: -10, alpha: fadeArc, size: 13 });
  lab.end();
  return playing;
});
const nav = document.getElementById('nav'), pb = nav.querySelector('.play');
const sync = () => { pb.textContent = playing ? 'Pause' : 'Play'; pb.setAttribute('aria-pressed', String(playing)) };
pb.onclick = () => { playing = !playing; if (playing && t >= 1) t = 0; sync(); cv.kick() };
nav.querySelector('[data-a=first]').onclick = () => { t = 0; hold = 0; cv.kick() };
document.addEventListener('visibilitychange', () => { if (document.hidden) { playing = false; sync() } });
P.reportHeight(document.querySelector('main'));
</script></body></html>
