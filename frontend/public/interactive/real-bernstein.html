<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bernstein polynomials</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script></head>
<body><main>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Bernstein polynomials of increasing degree close in on a continuous function"></canvas></div>
<div class="legend" id="leg"></div>
<div class="nav" id="nav"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P, K = (el, s) => katex.render(s, el, { throwOnError: false });
document.getElementById('leg').innerHTML = `<span class="key dash" style="--c:${C.mute}"></span><span id="k0"></span><span class="key" style="--c:${C.accent}"></span><span id="k1"></span>`;
K(document.getElementById('k0'), 'f'); K(document.getElementById('k1'), 'B_n(f)');
const f = x => .5 + .32 * Math.sin(2 * Math.PI * 1.5 * x) * (1 - .3 * x) + .22 * Math.abs(x - .62) - .1;
const NS = [1, 2, 3, 4, 6, 9, 14, 22, 35, 60, 110, 220];
const M = 400, xs = Array.from({ length: M + 1 }, (_, j) => j / M);
const lgam = x => { if (x < 7) { let r = 0; while (x < 7) { r -= Math.log(x); x++ } return r + lgam(x) } return (x - .5) * Math.log(x) - x + .5 * Math.log(2 * Math.PI) + 1 / (12 * x) - 1 / (360 * x ** 3) };
const B = n => xs.map(x => { let s = 0; for (let k = 0; k <= n; k++) { const lw = lgam(n + 1) - lgam(k + 1) - lgam(n - k + 1) + (k ? k * Math.log(x) : 0) + (n - k ? (n - k) * Math.log(1 - x) : 0); s += f(k / n) * (Number.isFinite(lw) ? Math.exp(lw) : 0) } return s });
const CACHE = NS.map(B), st = { y: CACHE[0] };
const v = P.view([0, 1, .05, 1.0], { l: 16, r: 16, t: 14, b: 18 });
let player;
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  v.w = w; v.h = h; const moving = player.tick(dt), n = NS[player.i];
  const mv = P.approach(st, 'y', CACHE[player.i], dt, 4.5);
  P.path(ctx, P.curve(v, f, 0, 1, 400), { color: C.mute, width: 1.6, dash: [5, 4] });
  const pts = xs.map((x, j) => [v.X(x), v.Y(st.y[j])]);
  P.fill(ctx, pts, P.curve(v, f, 0, 1, M), P.rgba(C.blue, .12));
  P.path(ctx, pts, { color: C.accent, width: 2.4, halo: 2 });
  if (n <= 60) for (let k = 0; k <= n; k++) P.dot(ctx, v.X(k / n), v.Y(f(k / n)), { r: n > 30 ? 2 : 3, color: C.blue, ring: false, alpha: .8, scale: P.ease.back(P.seg(player.p, 0, .5)) });
  return moving || mv;
});
player = P.stepper(document.getElementById('nav'), { count: NS.length, dur: 1.2, hold: .5, kick: cv.kick });
player.playing = true; player.go(0, false); player.wait = .6; cv.kick();
P.reportHeight(document.querySelector('main'));
</script></body></html>
