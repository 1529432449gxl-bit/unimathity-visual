<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maximum modulus principle</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{height:400px}@media(max-width:520px){canvas#cv{height:340px}}</style></head>
<body><main>
<div class="top" id="modes"></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Modulus surface of an analytic function over the unit disk; its highest point lies on the boundary. Drag to rotate"></canvas></div>
<div class="nav" id="nav"><button type="button" class="play" aria-pressed="true">Pause</button></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
import * as V from './vendor/view3d.js';
P.style();
const { C } = P, K = (el, s) => katex.render(s, el, { throwOnError: false });
const mul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
const FS = [
  { tex: 'e^{z}', f: z => { const e = Math.exp(z[0]); return [e * Math.cos(z[1]), e * Math.sin(z[1])] }, k: .42 },
  { tex: 'z^2+\\tfrac z2+\\tfrac12', f: z => { const q = mul(z, z); return [q[0] + z[0] / 2 + .5, q[1] + z[1] / 2] }, k: .62 },
  { tex: '\\cos\\!\\left(\\tfrac{3z}{2}\\right)', f: z => { const x = 1.5 * z[0], y = 1.5 * z[1]; return [Math.cos(x) * Math.cosh(y), -Math.sin(x) * Math.sinh(y)] }, k: .55 },
];
// 解析函数的线性组合仍解析：切换时按 (1-t)f+tg 连续变形，曲面始终是某个解析函数的模
let from = 0, to = 0, t = 1, playing = true;
const box = document.getElementById('modes');
FS.forEach((m, i) => { const b = document.createElement('button'); b.type = 'button'; K(b, m.tex); b.setAttribute('aria-pressed', String(i === 0));
  b.onclick = () => { from = to; to = i; t = 0; box.querySelectorAll('button').forEach((x, j) => x.setAttribute('aria-pressed', String(j === i))); cv.kick() }; box.appendChild(b) });
const cam = V.camera({ az: -.7, el: .5 });
const F = z => { const a = FS[from].f(z), b = FS[to].f(z), e = P.ease.inOut(t); return Math.hypot(P.lerp(a[0], b[0], e), P.lerp(a[1], b[1], e)) * P.lerp(FS[from].k, FS[to].k, e) };
const surf = (r, a) => { const x = r * Math.cos(a), y = r * Math.sin(a); return [x, y, F([x, y])] };
let drag;
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  if (t < 1) t = Math.min(1, t + dt / 1.1); if (playing && !drag.active) cam.az += dt * .15;
  cam.sc = Math.min(w, h) / 3.3; cam.ox = w / 2; cam.oy = h * .66;
  const q = V.mesh(surf, 0, 1, 0, 2 * Math.PI, 14, 48);
  V.axes(ctx, cam, [1.4, 1.4, 1.6], { alpha: .5 });
  const disk = []; for (let k = 0; k <= 96; k++) { const a = 2 * Math.PI * k / 96; disk.push([Math.cos(a), Math.sin(a), 0]) }
  V.line(ctx, cam, disk, { color: C.mute, width: 1, alpha: .6 });
  V.paint(ctx, cam, [{ quads: q, color: C.accent, alpha: .32, edge: .25, edgeColor: C.accent }]);
  const rim = []; let best = 0, bp = null;
  for (let k = 0; k <= 240; k++) { const p = surf(1, 2 * Math.PI * k / 240); rim.push(p); if (p[2] > best) { best = p[2]; bp = p } }
  V.line(ctx, cam, rim, { color: C.warm, width: 2.6 });
  V.line(ctx, cam, [[bp[0], bp[1], 0], bp], { color: C.warm, width: 1.2, dash: [3, 4], alpha: .8 });
  const pp = cam.P(bp); P.dot(ctx, pp[0], pp[1], { r: 6, color: C.warm });
  return t < 1 || playing || drag.active;
});
drag = V.drag(document.getElementById('cv'), cam, cv.kick);
const pb = document.querySelector('#nav .play');
const sync = () => { pb.textContent = playing ? 'Pause' : 'Play'; pb.setAttribute('aria-pressed', String(playing)) };
pb.onclick = () => { playing = !playing; sync(); cv.kick() };
document.addEventListener('visibilitychange', () => { if (document.hidden) { playing = false; sync() } });
P.reportHeight(document.querySelector('main'));
</script></body></html>
