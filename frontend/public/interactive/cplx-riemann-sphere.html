<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riemann sphere</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{height:400px}@media(max-width:520px){canvas#cv{height:340px}}</style></head>
<body><main>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Stereographic projection from the north pole; far points approach the pole. Drag to rotate"></canvas></div>
<div class="nav" id="nav"><button type="button" class="play" aria-pressed="true">Pause</button></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
import * as V from './vendor/view3d.js';
P.style();
const { C } = P;
const cam = V.camera({ az: -.75, el: .38 });
const st = P.lerp; let playing = true, clock = 0;
const proj = (x, y) => { const r2 = x * x + y * y; return [2 * x / (r2 + 1), 2 * y / (r2 + 1), (r2 - 1) / (r2 + 1)] };
const RADII = [.45, 1, 1.8, 3.2];
const lab = P.labels(document.getElementById('stage'));
let drag;
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  if (playing) clock += dt; if (!drag.active && playing) cam.az += dt * .12;
  cam.sc = Math.min(w, h) / 3.7; cam.ox = w / 2; cam.oy = h * .55;
  const L = 2.3;
  // 平面（半透明）与经纬线
  V.paint(ctx, cam, [V.poly([[-L, -L, 0], [L, -L, 0], [L, L, 0], [-L, L, 0]], C.blue, .07)]);
  const lat = (z0) => { const r = Math.sqrt(1 - z0 * z0), pts = []; for (let k = 0; k <= 96; k++) { const a = 2 * Math.PI * k / 96; pts.push([r * Math.cos(a), r * Math.sin(a), z0]) } return pts };
  for (let k = -3; k <= 3; k++) V.line(ctx, cam, lat(k / 4), { color: C.mute, width: .8, alpha: .35 });
  for (let k = 0; k < 6; k++) { const a = Math.PI * k / 6, pts = []; for (let j = 0; j <= 96; j++) { const t = 2 * Math.PI * j / 96; pts.push([Math.cos(a) * Math.cos(t), Math.sin(a) * Math.cos(t), Math.sin(t)]) } V.line(ctx, cam, pts, { color: C.mute, width: .8, alpha: .35 }) }
  // 平面上的同心圆与球面上对应的纬线
  RADII.forEach((r, i) => { const pl = [], sp = []; for (let k = 0; k <= 120; k++) { const a = 2 * Math.PI * k / 120, x = r * Math.cos(a), y = r * Math.sin(a); if (r <= L * 1.05) pl.push([x, y, 0]); sp.push(proj(x, y)) }
    if (pl.length) V.line(ctx, cam, pl, { color: C.blue, width: 1.4, alpha: .75 }); V.line(ctx, cam, sp, { color: C.warm, width: 1.8, alpha: .9 }) });
  // 动点：半径在对数尺度上往返，绕原点转动
  const u = (Math.sin(clock * .45) + 1) / 2, r = Math.exp(P.lerp(Math.log(.25), Math.log(9), P.ease.inOut(u))), a = clock * .5;
  const z = [r * Math.cos(a), r * Math.sin(a), 0], s = proj(z[0], z[1]), N = [0, 0, 1];
  const far = r > L * 1.05;
  const end = far ? [N[0] + (z[0] - N[0]) * (L * 1.3 / r), N[1] + (z[1] - N[1]) * (L * 1.3 / r), 1 - 1.3 * L / r] : z;
  V.line(ctx, cam, [N, end], { color: C.accent, width: 1.2, alpha: .55, dash: [4, 4] });
  const pN = cam.P(N); P.dot(ctx, pN[0], pN[1], { r: 4.5, color: C.accent });
  const ps = cam.P(s); P.dot(ctx, ps[0], ps[1], { r: 5.5, color: C.warm });
  if (!far) { const pz = cam.P(z); P.dot(ctx, pz[0], pz[1], { r: 5.5, color: C.blue }); lab.set('z', 'z', pz[0], pz[1], { color: C.blue, dx: 12, dy: 12 }) }
  lab.set('N', 'N', pN[0], pN[1], { color: C.accent, dy: -14 });
  lab.end();
  return playing || drag.active;
});
drag = V.drag(document.getElementById('cv'), cam, cv.kick);
const pb = document.querySelector('#nav .play');
const sync = () => { pb.textContent = playing ? 'Pause' : 'Play'; pb.setAttribute('aria-pressed', String(playing)) };
pb.onclick = () => { playing = !playing; sync(); cv.kick() };
document.addEventListener('visibilitychange', () => { if (document.hidden) { playing = false; sync() } });
P.reportHeight(document.querySelector('main'));
</script></body></html>
