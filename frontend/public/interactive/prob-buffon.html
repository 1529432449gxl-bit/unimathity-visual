<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buffon needle and sample space</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{height:340px}@media(max-width:520px){canvas#cv{height:520px}}</style></head>
<body><main>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Needles dropped on parallel lines and the matching points in the sample space"></canvas></div>
<div class="nav" id="nav"><button type="button" data-a="first" aria-label="Restart">↺</button><button type="button" class="play" aria-pressed="true">Pause</button></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P;
const glow = (ctx, x, y, r, col, a = .16) => { if (a <= 0) return; ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = P.rgba(col, a); ctx.fill(); ctx.restore() };
const d = 2, l = 1.5, N = 240, GAP = .11;
// 伪随机（固定种子，每轮换种子）
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
let needles = [], clock = 0, playing = true;
function round() { needles = []; clock = 0; seed = 7 + Math.floor(Math.random() * 1e6);
  for (let k = 0; k < N; k++) { const yc = rnd() * d * 3, xc = rnd(), phi = rnd() * Math.PI;
    const dist = Math.min(yc % d, d - yc % d); needles.push({ yc, xc, phi, dist, hit: dist <= l / 2 * Math.sin(phi), t: 0 }) }
  for (let k = 1; k < N; k++) needles[k].t = needles[k - 1].t + GAP * (k < 25 ? 2.4 : k < 80 ? 1 : .5);
}
round();
const lab = P.labels(document.getElementById('stage'));
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  if (playing) clock += dt;
  const end = needles[N - 1].t + 2.2; if (clock > end + 1.2) round();
  const fade = 1 - P.seg(clock, end, end + 1.2);
  const stack = w < 520, pad = 16;
  // 左：平行线与针。区域宽 Lw，竖向 3d
  const L = stack ? { x: pad, y: 10, w: w - 2 * pad, h: h * .5 - 20 } : { x: pad, y: 16, w: w * .52 - 2 * pad, h: h - 40 };
  const R = stack ? { x: pad + 26, y: h * .5 + 18, w: w - 2 * pad - 40, h: h * .5 - 50 } : { x: w * .52 + 34, y: 30, w: w * .48 - 64, h: h - 72 };
  const ly = y => L.y + L.h - y / (3 * d) * L.h, lx = x => L.x + x * L.w, unit = L.h / (3 * d);
  for (let k = 0; k <= 3; k++) P.path(ctx, [[L.x, ly(k * d)], [L.x + L.w, ly(k * d)]], { color: C.mute, width: 1.1, alpha: .7 });
  // 右：样本空间 [0,π]×[0,d/2]
  const rx = p => R.x + p / Math.PI * R.w, ry = x => R.y + R.h - x / (d / 2) * R.h;
  const top = [], bot = []; for (let k = 0; k <= 80; k++) { const p = Math.PI * k / 80; top.push([rx(p), ry(l / 2 * Math.sin(p))]); bot.push([rx(p), ry(0)]) }
  P.fill(ctx, top, bot, P.rgba(C.blue, .16));
  P.path(ctx, [[rx(0), ry(0)], [rx(Math.PI), ry(0)], [rx(Math.PI), ry(d / 2)], [rx(0), ry(d / 2)], [rx(0), ry(0)]], { color: C.rule, width: 1 });
  P.path(ctx, top, { color: C.accent, width: 2.4, halo: 3, progress: P.ease.out(P.seg(clock, 0, 1.2)) });
  for (const n of needles) {
    const age = clock - n.t; if (age < 0) break;
    const pop = P.ease.back(P.seg(age, 0, .35)), recent = 1 - P.seg(age, .4, 3.5), col = n.hit ? C.warm : C.accent;
    // 针从上方旋转着落下，落定后按年龄淡出
    const fall = P.ease.out(P.seg(age, 0, .45)), ang = n.phi + (1 - fall) * 1.4, half = l / 2 * unit, cx = lx(n.xc), cy = ly(n.yc) - (1 - fall) * 26, ux = Math.cos(ang) * half, uy = Math.sin(ang) * half;
    if (n.hit && recent > 0) glow(ctx, lx(n.xc), ly(n.yc), half * .8 * P.ease.back(P.seg(age, .4, .8)), C.warm, .1 * recent);
    P.path(ctx, [[cx - ux, cy + uy], [cx + ux, cy - uy]], { color: col, width: 1.2 + 1.2 * recent, alpha: fade * (.3 + .7 * recent) * P.seg(age, 0, .15) });
    if (recent > 0) glow(ctx, rx(n.phi), ry(n.dist), 9 * P.ease.back(P.seg(age, .35, .75)), col, .18 * recent * fade);
    P.dot(ctx, rx(n.phi), ry(n.dist), { r: 2.2 + 1.8 * recent, color: col, ring: recent > .5, alpha: fade * (.55 + .45 * recent), scale: P.ease.back(P.seg(age, .35, .75)) });
  }
  lab.set('phi', '\\varphi', R.x + R.w / 2, ry(0) + 15, { color: C.soft });
  lab.set('pi', '\\pi', rx(Math.PI), ry(0) + 15, { color: C.soft });
  lab.set('o', '0', rx(0) - 2, ry(0) + 15, { color: C.soft, size: 12 });
  lab.set('x', 'x', rx(0) - 14, R.y + R.h / 2, { color: C.soft });
  lab.set('dh', '\\tfrac d2', rx(0) - 16, ry(d / 2), { color: C.soft, size: 13 });
  lab.set('c', 'x=\\tfrac l2\\sin\\varphi', rx(Math.PI * .5), ry(l / 2) - 16, { color: C.accent, size: 13 });
  lab.end();
  return playing || fade < 1;
});
const nav = document.getElementById('nav'), pb = nav.querySelector('.play');
const sync = () => { pb.textContent = playing ? 'Pause' : 'Play'; pb.setAttribute('aria-pressed', String(playing)) };
pb.onclick = () => { playing = !playing; sync(); cv.kick() };
nav.querySelector('[data-a=first]').onclick = () => { round(); cv.kick() };
document.addEventListener('visibilitychange', () => { if (document.hidden) { playing = false; sync() } });
P.reportHeight(document.querySelector('main'));
</script></body></html>
