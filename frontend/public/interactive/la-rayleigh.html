<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rayleigh quotient</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>main{max-width:900px;margin:auto}.stage canvas{height:360px}@media(max-width:520px){.stage canvas{height:300px}}</style></head>
<body><main>

<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Rayleigh quotient"></canvas></div>
<div class="controls"><button type="button" class="tg" id="play" aria-pressed="false">Play</button></div>
<div class="legend" id="lg"></div>
<div class="fx"><div id="eq"></div></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
import * as G from './vendor/la2d.js';
P.style();
const { C } = P, stage = document.getElementById('stage'), canvas = document.getElementById('cv'), lab = P.labels(stage), lg = document.getElementById('lg');
const PH = 0.52, lmax = 1.55, lmin = 0.6, q1 = [Math.cos(PH), Math.sin(PH)], q2 = [-q1[1], q1[0]];
const R = u => lmax * G.dot(u, q1) ** 2 + lmin * G.dot(u, q2) ** 2;
const v = G.plane(1.8);
const S = { th: 1.3, thT: 1.3, playing: false };
const set = G.playToggle(document.getElementById('play'), S, () => cv.kick());
G.legend(lg, [['x', C.accent], ['\\dfrac{x^{\\prime}Ax}{x^{\\prime}x}\\,x', C.warm], ['\\lambda_{\\min},\\ \\lambda_{\\max}', C.mute, 1], ['q_1,\\ q_2', C.blue, 1]]);
const eq = G.formulas(document.getElementById('eq'), ['\\lambda_{\\min}\\leqslant\\dfrac{x^{\\prime}Ax}{x^{\\prime}x}\\leqslant\\lambda_{\\max}']);
eq('\\lambda_{\\min}\\leqslant\\dfrac{x^{\\prime}Ax}{x^{\\prime}x}\\leqslant\\lambda_{\\max}');
const hd = G.handles(canvas, v, () => [{ id: 0, p: [Math.cos(S.th), Math.sin(S.th)] }], (id, w) => { let t = Math.atan2(w[1], w[0]); while (t - S.th > Math.PI) t -= 2 * Math.PI; while (t - S.th < -Math.PI) t += 2 * Math.PI; S.thT = t }, { onStart: () => set(false), kick: () => cv.kick() });
const cv = P.mount(canvas, (ctx, w, h, dt) => {
  v.fit(w, h);
  if (S.playing) S.thT += dt * 0.5;
  const mv = P.approach(S, 'th', S.thT, dt, 12);
  const circ = r => [...Array(145)].map((_, i) => [r * Math.cos(i * Math.PI / 72), r * Math.sin(i * Math.PI / 72)]);
  P.path(ctx, circ(1).map(v.S), { color: C.rule, width: 1 });
  P.path(ctx, circ(lmax).map(v.S), { color: C.mute, width: 1.1, dash: [5, 5], alpha: .7 }); P.path(ctx, circ(lmin).map(v.S), { color: C.mute, width: 1.1, dash: [5, 5], alpha: .7 });
  G.fullLine(ctx, v, q1, { color: C.blue, alpha: .35, dash: [6, 5] }); G.fullLine(ctx, v, q2, { color: C.blue, alpha: .35, dash: [6, 5] });
  const curve = [...Array(241)].map((_, i) => { const t = i * Math.PI / 120, u = [Math.cos(t), Math.sin(t)]; return G.mul(R(u), u) });
  P.path(ctx, curve.map(v.S), { color: C.warm, width: 2, alpha: .55 });
  const u = [Math.cos(S.th), Math.sin(S.th)], p = G.mul(R(u), u);
  const touch = Math.abs(R(u) - lmax) < 0.01 || Math.abs(R(u) - lmin) < 0.01;
  G.seg(ctx, v, [0, 0], G.mul(1.75, u), { color: C.accent, width: 1, alpha: .35 });
  G.arrow(ctx, v, [0, 0], u, { color: C.accent, width: 2.8 });
  G.dotAt(ctx, v, p, { r: touch ? 7 : 5.5, color: C.warm });
  G.dotAt(ctx, v, u, { r: hd.active != null || hd.hover != null ? 6.5 : 4.5, color: C.accent });
  const a = v.S(G.mul(lmax, [Math.cos(2.3), Math.sin(2.3)])), b = v.S(G.mul(lmin, [Math.cos(2.0), Math.sin(2.0)])), su = v.S(u);
  lab.set('mx', '\\lambda_{\\max}', a[0], a[1], { dx: -22, dy: -6, color: C.mute, size: 13 }); lab.set('mn', '\\lambda_{\\min}', b[0], b[1], { dx: -6, dy: 14, color: C.mute, size: 13 });
  lab.set('x', 'x', su[0], su[1], { dx: -12, dy: -10, color: C.accent }); lab.end();
  return mv || S.playing || hd.active != null;
});
cv.kick();

P.reportHeight(document.querySelector('main'));
</script></body></html>
