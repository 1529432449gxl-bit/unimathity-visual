<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composition of linear maps</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>main{max-width:900px;margin:auto}.stage canvas{height:360px}@media(max-width:520px){.stage canvas{height:300px}}</style></head>
<body><main>
<div class="top" id="order"></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Composition of linear maps"></canvas></div>
<div class="controls"><button type="button" class="tg" id="play" aria-pressed="false">Play</button></div>
<div class="legend" id="lg"></div>
<div class="fx"><div id="eq"></div></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
import * as G from './vendor/la2d.js';
P.style();
const { C } = P, stage = document.getElementById('stage'), canvas = document.getElementById('cv'), lab = P.labels(stage), lg = document.getElementById('lg');
const v = G.plane(1.05); v.cx = .3; v.cy = .72;
const shape = [[0, 0], [0.9, 0], [0.9, 0.22], [0.25, 0.22], [0.25, 0.5], [0.65, 0.5], [0.65, 0.72], [0.25, 0.72], [0.25, 1.1], [0, 1.1]];
const Am = t => [[1, 0.85 * t], [0, 1]], Bm = t => G.rot(0.85 * t);
const S = { order: 'AB', s: 0, playing: false, wait: 0 };
const set = G.playToggle(document.getElementById('play'), S, () => cv.kick());
const F = { AB: '(AB)x=A(Bx)', BA: '(BA)x=B(Ax)' };
const eq = G.formulas(document.getElementById('eq'), [F.AB + ',\\qquad AB\\neq BA', F.BA + ',\\qquad AB\\neq BA']);
G.segmented(document.getElementById('order'), [['AB', 'AB'], ['BA', 'BA']], 'AB', o => { S.order = o; S.s = 0; set(true) });
G.legend(lg, [['x', C.mute], ['Bx,\\ Ax', C.blue], ['ABx', C.accent], ['BAx', C.warm]]);
const M = (order, s) => { const f = order === 'AB' ? [Bm, Am] : [Am, Bm]; const a = Math.min(1, s), b = Math.max(0, s - 1); const ease = t => t * t * (3 - 2 * t); return G.mm(f[1](ease(b)), f[0](ease(a))) };
const cv = P.mount(canvas, (ctx, w, h, dt) => {
  v.fit(w, h);
  if (S.playing) { if (S.s < 2) S.s = Math.min(2, S.s + dt * 0.7); else { S.wait += dt; if (S.wait > 1.4) { S.wait = 0; S.s = 0; S.order = S.order } } }
  const tf = Mx => shape.map(p => G.apply(Mx, p));
  G.poly(ctx, v, shape, { stroke: C.mute, width: 1.2, alpha: .7 });
  const other = S.order === 'AB' ? 'BA' : 'AB';
  G.poly(ctx, v, tf(M(other, 2)), { stroke: other === 'BA' ? C.warm : C.accent, width: 1.3, alpha: .5 });
  const mid = M(S.order, 1);
  if (S.s > 1) G.poly(ctx, v, tf(mid), { stroke: C.blue, width: 1.2, alpha: .55 });
  const cur = M(S.order, S.s), col = S.order === 'AB' ? C.accent : C.warm;
  G.poly(ctx, v, tf(cur), { fill: col, fillAlpha: .22, stroke: col, width: 2 });
  lab.end(); eq(F[S.order] + ',\\qquad AB\\neq BA');
  return S.playing;
});
cv.kick();

P.reportHeight(document.querySelector('main'));
</script></body></html>
