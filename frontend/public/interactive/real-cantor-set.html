<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cantor ternary set</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script>
<style>canvas#cv{height:340px}@media(max-width:520px){canvas#cv{height:300px}}</style></head>
<body><main>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Removing open middle thirds level by level; the camera zooms into the left end"></canvas></div>
<div class="nav" id="nav"></div>
</main>
<script type="module">
import * as P from './vendor/plotfx.js';
P.style();
const { C } = P;
const LV = 8;
const levels = [[[0, 1]]];
for (let k = 1; k <= LV; k++) { const out = []; for (const [a, b] of levels[k - 1]) { const t = (b - a) / 3; out.push([a, a + t], [b - t, b]) } levels.push(out) }
const FRAMES = [0, 0, 0, 0, 1, 1, 2, 2, 3].map(z => [0, Math.pow(3, -z)]);
const st = { f: [0, 1] };
const lab = P.labels(document.getElementById('stage'));
let player;
const cv = P.mount(document.getElementById('cv'), (ctx, w, h, dt) => {
  const moving = player.tick(dt), n = player.i, p = player.p;
  const cam = P.approach(st, 'f', FRAMES[n], dt, 2.6), [u0, u1] = st.f;
  const L = 20, Rr = w - 20, X = x => L + (x - u0) / (u1 - u0) * (Rr - L), rowH = (h - 40) / (LV + 1), Y = k => 22 + k * rowH;
  for (let k = 0; k <= n; k++) {
    const y = Y(k), fresh = k === n, a = fresh ? P.ease.out(P.seg(p, .25, 1)) : 1;
    for (const [s, e] of levels[k]) { if (X(e) < 0 || X(s) > w) continue; P.path(ctx, [[X(s), y], [Math.max(X(s) + .6, X(e)), y]], { color: C.accent, width: k < 3 ? 4 : 3, alpha: fresh ? a : 1 }) }
    if (k > 0 && fresh) for (const [s, e] of levels[k - 1]) { const t = (e - s) / 3; if (X(e) < 0 || X(s) > w) continue;
      P.path(ctx, [[X(s + t), y], [X(e - t), y]], { color: C.warm, width: 4, alpha: 1 - P.seg(p, .5, 1) * .85 }) }
  }
  // 放大后，左上角小地图显示全局与镜头框
  const zoomed = u1 < .6, mm = P.clamp((1 - u1) * 2, 0, 1);
  if (zoomed) P.minimap(ctx, { w, h, b: [u0, u1, 0, 1] }, { B: [0, 1, 0, 1], alpha: mm, corner: 'tr', frac: .26, aspect: .4,
    paint: (mx, my) => { for (let k = 0; k <= Math.min(n, 5); k++) for (const [s, e] of levels[k]) P.path(ctx, [[mx(s), my(.9 - k * .16)], [Math.max(mx(s) + .5, mx(e)), my(.9 - k * .16)]], { color: C.accent, width: 1.6 }) } });
  lab.set('0', '0', X(0), Y(0) - 12, { color: C.soft, size: 12, alpha: X(0) > 0 ? 1 : 0 });
  lab.set('1', '1', X(1), Y(0) - 12, { color: C.soft, size: 12, alpha: X(1) < w ? 1 : 0 });
  lab.set('P', 'P_{' + n + '}', 10, Y(n) + rowH * .45, { color: C.mute, size: 11, alpha: 0 });
  lab.end();
  return moving || cam;
});
player = P.stepper(document.getElementById('nav'), { count: LV + 1, dur: 1.4, hold: .6, kick: cv.kick });
player.playing = true; player.go(0, false); player.wait = .6; cv.kick();
P.reportHeight(document.querySelector('main'));
</script></body></html>
