<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求积公式的几何意义</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><script src="vendor/katex/katex.min.js"></script><script src="vendor/morph.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#fbfbfa;color:#161820;font:14px/1.6 "Microsoft YaHei",sans-serif}main{padding:8px 2px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}.seg{display:flex;gap:6px}
button{font:inherit;font-size:13px;border:1px solid #223056;border-radius:4px;color:#223056;padding:3px 12px;background:transparent;cursor:pointer}button[aria-pressed="true"]{background:#223056;color:#fff}
.n{min-width:52px}.bar input{flex:1;min-width:140px;accent-color:#223056;min-height:30px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{position:relative}.main{flex:3 1 380px}.side{flex:2 1 240px}
canvas{display:block;width:100%;height:280px}.lab{position:absolute;left:10px;top:4px;font-size:14px;pointer-events:none}
.side .lab{left:auto;right:8px}
button:focus-visible,input:focus-visible{outline:2px solid #223056;outline-offset:2px}@media(max-width:480px){canvas{height:230px}}</style></head>
<body><main>
<div class="bar"><div class="seg" id="rules"></div><span class="n" id="nlab"></span><input id="n" type="range" min="1" max="16" step="1" value="2" aria-label="分段数"></div>
<div class="row"><div class="main"><canvas id="cv" role="img"></canvas><div class="lab" id="err"></div></div><div class="side"><canvas id="cv2" role="img"></canvas><div class="lab" id="lab2"></div></div></div>
</main>
<script>
const K=(el,s)=>katex.render(s,el,{throwOnError:false});
const f=x=>1+Math.sin(2*x)/2+x*x/8,a=0,b=3;
const I=(()=>{const F=x=>x-Math.cos(2*x)/4+x**3/24;return F(b)-F(a)})();
const RULES=[{id:'T',name:'Trapezoid',col:'#b5763a'},{id:'M',name:'Midpoint',col:'#3f6e8c'},{id:'S',name:'Simpson',col:'#a4493f'}];
let rule='T';
function approx(id,n){const h=(b-a)/n;let s=0;for(let k=0;k<n;k++){const x0=a+k*h,x1=x0+h,m=(x0+x1)/2;s+=id==='T'?h*(f(x0)+f(x1))/2:id==='M'?h*f(m):h*(f(x0)+4*f(m)+f(x1))/6}return s}
function piece(id,x0,x1){const m=(x0+x1)/2,f0=f(x0),f1=f(x1),fm=f(m);
 if(id==='T')return x=>f0+(f1-f0)*(x-x0)/(x1-x0);if(id==='M')return()=>fm;
 return x=>f0*(x-m)*(x-x1)/((x0-m)*(x0-x1))+fm*(x-x0)*(x-x1)/((m-x0)*(m-x1))+f1*(x-x0)*(x-m)/((x1-x0)*(x1-m))}
function setup(cv){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,w:r.width,h:r.height}}
function draw(){const n=+document.getElementById('n').value;K(document.getElementById('nlab'),'n='+n);
 const {c,w,h}=setup(document.getElementById('cv')),pad={l:12,r:12,t:28,b:22},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b,X=x=>pad.l+(x-a)*pw/(b-a),Y=y=>pad.t+(2.4-y)*ph/2.4;
 const col=RULES.find(r=>r.id===rule).col,hh=(b-a)/n;
 c.lineJoin=c.lineCap='round';const G=600,GX=Array.from({length:G+1},(_,i)=>a+(b-a)*i/G);
 const tgt=GX.map(x=>{const k=Math.min(n-1,Math.floor((x-a)/hh)),x0=a+k*hh;return piece(rule,x0,x0+hh)(x)});
 const Q=Morph.v('q',tgt,9),fy=GX.map(f);
 c.beginPath();c.moveTo(X(a),Y(0));GX.forEach((x,i)=>c.lineTo(X(x),Y(Q[i])));c.lineTo(X(b),Y(0));c.closePath();c.fillStyle='rgba(34, 48, 86,.12)';c.fill();
 c.beginPath();GX.forEach((x,i)=>i?c.lineTo(X(x),Y(fy[i])):c.moveTo(X(x),Y(fy[i])));for(let i=G;i>=0;i--)c.lineTo(X(GX[i]),Y(Q[i]));c.closePath();c.fillStyle='rgba(181,118,58,.5)';c.fill();
 c.beginPath();GX.forEach((x,i)=>i?c.lineTo(X(x),Y(Q[i])):c.moveTo(X(x),Y(Q[i])));c.strokeStyle=col;c.lineWidth=1.8;c.stroke();
 const fade=Morph.s('fd'+n+rule,1,7);Morph.v('fd'+(n+1)+rule,[0]);Morph.v('fd'+(n-1)+rule,[0]);
 c.strokeStyle='rgba(34, 48, 86,'+(.3*fade)+')';c.lineWidth=1;for(let k=1;k<n;k++){const x=a+k*hh,i=Math.round((x-a)/(b-a)*G);c.beginPath();c.moveTo(X(x),Y(0));c.lineTo(X(x),Y(Q[i]));c.stroke()}
 const e=I-approx(rule,n);K(document.getElementById('err'),`I-${rule==='T'?'T':rule==='M'?'M':'S'}_{${n}}=${fmt(e)}`);
 // 误差-分段数 对数图
 const g=setup(document.getElementById('cv2')),P={l:34,r:8,t:26,b:22},W=g.w-P.l-P.r,H=g.h-P.t-P.b,lx=v=>P.l+Math.log2(v)/4*W,ly=v=>P.t+(-Math.log10(v)-0)/9*H,cc=g.c;
 cc.font='10px "Microsoft YaHei",sans-serif';cc.fillStyle='#7a7c84';cc.strokeStyle='#e3e4e8';cc.lineWidth=1;cc.textAlign='right';
 for(let k=0;k<=9;k+=3){cc.beginPath();cc.moveTo(P.l,ly(10**-k));cc.lineTo(P.l+W,ly(10**-k));cc.stroke();cc.fillText(k?'1e-'+k:'1',P.l-4,ly(10**-k)+3)}
 cc.textAlign='center';[1,2,4,8,16].forEach(v=>cc.fillText(String(v),lx(v),g.h-6));
 RULES.forEach(r=>{cc.beginPath();for(let m=1;m<=16;m++){const v=Math.max(1e-12,Math.abs(I-approx(r.id,m)));m>1?cc.lineTo(lx(m),ly(v)):cc.moveTo(lx(m),ly(v))}cc.strokeStyle=r.col;cc.globalAlpha=r.id===rule?1:.35;cc.lineWidth=r.id===rule?2.2:1.4;cc.stroke();cc.globalAlpha=1});
 const v=Math.abs(e);cc.beginPath();cc.arc(lx(n),ly(Math.max(v,1e-12)),4.5,0,7);cc.fillStyle=col;cc.fill();
 document.getElementById('cv').setAttribute('aria-label',`${n} 段，误差 ${e.toExponential(2)}`)}
function fmt(e){if(Math.abs(e)<1e-3){const p=Math.floor(Math.log10(Math.abs(e)));return (e/10**p).toFixed(2)+'\\times10^{'+p+'}'}return e.toFixed(4)}
K(document.getElementById('lab2'),'|I-Q_n|');
const box=document.getElementById('rules');RULES.forEach(r=>{const bt=document.createElement('button');bt.type='button';bt.textContent=r.name;bt.setAttribute('aria-pressed',r.id===rule);bt.onclick=()=>{rule=r.id;box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===bt));kick()};box.appendChild(bt)});
const kick=Morph.bind(draw);document.getElementById('n').addEventListener('input',kick);
new ResizeObserver(()=>{parent.postMessage({type:'runge-height',height:Math.ceil(document.querySelector('main').getBoundingClientRect().height)},location.origin)}).observe(document.querySelector('main'));
new ResizeObserver(draw).observe(document.querySelector('.row'));
</script></body></html>
